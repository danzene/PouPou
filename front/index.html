<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<script>(function(){try{var t=localStorage.getItem("mb-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>PouPou — Compare, escolha e economize nas compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#f7f8f5; --surface:#ffffff; --surface-2:#f2f4f0; --line:#e3e8e4; --line-2:#d5dbd6;
    --ink:#17211c; --mut:#68736d; --faint:#95a09a;
    --green:#16a36a; --green-dark:#087a4b; --green-light:#e8f6ef; --on-green:#ffffff;
    --yellow:#f4b942; --yellow-soft:#fdf3dd;
    --red:#d64b3f; --red-soft:#fbeae8;
    --focus:#1f6bff;
    --r-card:14px; --r-btn:10px; --r-input:12px; --r-pill:999px;
    --sh-sm:0 1px 2px rgba(23,33,28,.04);
    --sh:0 1px 3px rgba(23,33,28,.05), 0 6px 18px rgba(23,33,28,.05);
    --wrap:1080px;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0f1512; --surface:#171e1a; --surface-2:#212a24; --line:#2a332e; --line-2:#3a453e;
    --ink:#e9efeb; --mut:#9aa5a0; --faint:#6f7b75;
    --green:#2fbf83; --green-dark:#5fd39c; --green-light:#123528; --on-green:#052117;
    --yellow:#e3b341; --yellow-soft:#33290f;
    --red:#ff7c6d; --red-soft:#3a221f;
    --focus:#5b9dff;
    --sh-sm:0 1px 2px rgba(0,0,0,.4);
    --sh:0 2px 8px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.45);
  }
  *{ box-sizing:border-box; }
  html{ background:var(--bg); }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font:400 16px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; }
  b,strong{ font-weight:600; }
  a{ color:var(--focus); text-decoration:none; }
  .num{ font-variant-numeric:tabular-nums; }
  .ico{ display:inline-flex; vertical-align:-.15em; }
  .ico svg{ width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); border:0; }
  .skip{ position:absolute; left:-999px; top:0; background:var(--surface); padding:10px 14px; border-radius:var(--r-btn); z-index:30; }
  .skip:focus{ left:12px; top:12px; outline:3px solid var(--focus); }
  :focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

  /* ---------- header ---------- */
  header{ background:var(--surface); border-bottom:1px solid var(--line); }
  .head-in{ max-width:var(--wrap); margin:0 auto; padding:18px 20px 16px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .logo{ width:44px; height:44px; flex:0 0 auto; display:grid; place-items:center; }
  .brand .logo svg{ width:44px; height:44px; display:block; }
  .brand h1{ margin:0; font-size:23px; font-weight:700; letter-spacing:-.02em; color:var(--green-dark); }
  .brand h1 .p2{ color:var(--green); }
  .brand .loc{ margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-size:14px; color:var(--mut); }
  .tagline{ color:var(--mut); font-size:14.5px; margin:6px 0 16px 52px; max-width:640px; }
  @media(max-width:560px){ .tagline{ margin-left:0; } }
  .searchrow{ display:flex; gap:12px; }
  .search{ position:relative; flex:1; }
  .search .mag{ position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:19px; }
  .search input{ width:100%; height:52px; padding:0 16px 0 46px; font-size:15.5px; color:var(--ink);
    border:1px solid var(--line); border-radius:var(--r-input); background:var(--surface); }
  .search input::placeholder{ color:var(--faint); }
  .search input:focus-visible{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-light); }
  .cesta-btn{ height:52px; padding:0 20px; font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap;
    border:none; border-radius:var(--r-btn); background:var(--green); color:var(--on-green); display:inline-flex; align-items:center;
    gap:8px; position:relative; box-shadow:var(--sh-sm); }
  .cesta-btn:hover{ background:var(--green-dark); }
  .cesta-btn .pill{ background:rgba(255,255,255,.24); border-radius:var(--r-pill); min-width:22px; height:22px;
    padding:0 6px; display:inline-grid; place-items:center; font-size:12.5px; font-weight:600; }
  .cesta-btn .dot{ position:absolute; top:-3px; right:-3px; width:12px; height:12px; border-radius:50%;
    background:var(--yellow); border:2px solid var(--surface); }
  .cesta-btn .dot[hidden]{ display:none; }

  /* ---------- category nav ---------- */
  nav.cats{ max-width:var(--wrap); margin:0 auto; padding:14px 20px 4px; display:flex; gap:22px; overflow-x:auto; scrollbar-width:none; }
  nav.cats::-webkit-scrollbar{ display:none; }
  .cat{ flex:0 0 auto; display:inline-flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
    border:none; background:none; color:var(--mut); font-size:13px; font-weight:500; padding:2px 2px 8px; border-bottom:2px solid transparent; }
  .cat .ci{ font-size:22px; color:var(--mut); }
  .cat:hover{ color:var(--ink); } .cat:hover .ci{ color:var(--ink); }
  .cat[aria-pressed="true"]{ color:var(--green-dark); border-bottom-color:var(--green); }
  .cat[aria-pressed="true"] .ci{ color:var(--green); }
  .subcats{ max-width:var(--wrap); margin:0 auto; padding:8px 20px 0; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; align-items:center; }
  .subcats::-webkit-scrollbar{ display:none; }
  .subcats .lbl{ font-size:12px; color:var(--faint); white-space:nowrap; margin-right:2px; }
  .sub{ flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--mut); font-size:13.5px; font-weight:500;
    cursor:pointer; padding:6px 13px; border-radius:var(--r-pill); display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .sub:hover{ border-color:var(--line-2); color:var(--ink); }
  .sub[aria-pressed="true"]{ background:var(--green); border-color:var(--green); color:var(--on-green); }
  .sub.oferta[aria-pressed="true"]{ background:var(--yellow); border-color:var(--yellow); color:#5c3d00; }

  /* ---------- main ---------- */
  main{ max-width:var(--wrap); margin:0 auto; padding:22px 20px 60px; }
  .ctx{ color:var(--mut); font-size:14px; margin:0 2px 16px; }
  .state{ text-align:center; color:var(--mut); padding:64px 16px; font-size:16px; }
  .state .big{ display:block; font-size:32px; color:var(--faint); margin-bottom:12px; }
  .sec-title{ font-size:15px; font-weight:600; color:var(--ink); margin:26px 2px 12px; display:flex; align-items:center; gap:8px; }
  .sec-title .muted{ font-weight:400; color:var(--mut); font-size:13px; }

  /* ---------- product grid / card (e-commerce) ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:16px; align-items:stretch; }
  @media(max-width:900px){ .grid{ grid-template-columns:1fr; } }
  @media(max-width:560px){ .grid{ grid-template-columns:1fr; } }
  .prod{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--sh-sm); overflow:hidden; display:flex; flex-direction:column; }
  .prod-top{ display:flex; gap:14px; padding:16px; flex:1 1 auto; }
  .thumb{ width:74px; height:74px; border-radius:12px; object-fit:contain; background:var(--surface-2); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; padding:4px; }
  .thumb[data-no-image]{ color:var(--faint); font-size:30px; }
  .thumb[data-no-image]::before{ content:"\1F6D2"; }
  .prod-info{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .prod-nome{ font-size:15.5px; font-weight:600; line-height:1.3; color:var(--ink); margin:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .prod-meta{ font-size:13px; color:var(--mut); margin-top:3px; }
  .prod-price{ margin-top:auto; padding-top:10px; }
  .lbl-menor{ font-size:11px; font-weight:600; letter-spacing:.06em; color:var(--green-dark); text-transform:uppercase; }
  .prod-preco{ font-size:27px; font-weight:700; color:var(--ink); line-height:1.05; letter-spacing:-.02em; }
  .prod-preco .uni{ font-size:.55em; font-weight:600; color:var(--mut); }
  .prod-mkt{ display:flex; align-items:center; gap:7px; margin-top:5px; font-size:13.5px; color:var(--ink); }
  .prod-n{ font-size:12.5px; color:var(--faint); margin-top:2px; }
  .prod-foot{ display:flex; gap:10px; padding:0 16px 16px; margin-top:auto; }
  .btn-compare{ flex:1; height:44px; border:1px solid var(--green); background:var(--green-light); color:var(--green-dark);
    font-size:14.5px; font-weight:600; border-radius:var(--r-btn); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .btn-compare:hover{ background:#dff0e7; }
  .btn-compare .chev{ transition:transform .15s; }
  .btn-compare[aria-expanded="true"] .chev{ transform:rotate(180deg); }
  .btn-add{ width:44px; height:44px; flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--green-dark);
    border-radius:var(--r-btn); cursor:pointer; font-size:20px; display:grid; place-items:center; }
  .btn-add:hover{ border-color:var(--green); background:var(--green-light); }
  .btn-add.in{ background:var(--green); border-color:var(--green); color:var(--on-green); }

  /* ---------- ranking de preços (comparação) ---------- */
  .rank{ list-style:none; margin:0; padding:6px 16px 14px; border-top:1px solid var(--line); }
  .rank-row{ display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid var(--line); }
  .rank-row:last-child{ border-bottom:none; }
  .rank-pos{ width:22px; text-align:center; font-size:13px; font-weight:600; color:var(--faint); flex:0 0 auto; }
  .rank-row.best .rank-pos{ color:var(--green); }
  .badge{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:600;
    flex:0 0 auto; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .badge-logo{ background:#fff; overflow:hidden; }
  .badge-logo img{ width:100%; height:100%; object-fit:contain; padding:2px; }
  .rank-info{ flex:1; min-width:0; border:none; background:none; cursor:pointer; text-align:left; padding:4px 4px; border-radius:8px;
    display:flex; flex-direction:column; gap:2px; align-items:flex-start; }
  .rank-info:hover{ background:var(--surface-2); }
  .rank-nome{ font-size:14px; font-weight:500; color:var(--ink); display:inline-flex; align-items:center; gap:6px; }
  .rank-fresc{ font-size:9px; } .fresc-ok{ color:var(--green); } .fresc-mid{ color:var(--yellow); } .fresc-old{ color:var(--red); }
  .rank-hist{ font-size:11px; color:var(--focus); }
  .rank-info[aria-expanded="true"] .rank-hist::after{ content:" \25B2"; }
  .rank-tags{ display:flex; gap:5px; flex-wrap:wrap; }
  .rank-price{ text-align:right; flex:0 0 auto; }
  .rank-price .v{ font-size:15.5px; font-weight:600; color:var(--mut); }
  .rank-row.best .rank-price .v{ color:var(--green-dark); font-weight:700; }
  .rank-price .de{ display:block; font-size:11px; color:var(--faint); text-decoration:line-through; }
  .rank-menor{ font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--green-dark); }
  .ver-site{ flex:0 0 auto; width:30px; height:30px; display:grid; place-items:center; color:var(--focus);
    border:1px solid var(--line); border-radius:8px; font-size:15px; }
  .ver-site:hover{ border-color:var(--focus); }

  /* tags de promoção */
  .tag-off{ font-size:11px; font-weight:600; color:var(--red); background:var(--red-soft); border-radius:var(--r-pill); padding:2px 8px; }
  .tag-site{ font-size:11px; font-weight:600; color:var(--green-dark); background:var(--green-light); border-radius:var(--r-pill); padding:2px 8px; }
  /* fidelidade = preço que exige cartão/app do mercado (não é pra todos) */
  .tag-fid{ font-size:11px; font-weight:700; color:#7a4e00; background:#ffe7ad; border:1px solid #f0c66a; border-radius:var(--r-pill); padding:2px 8px; }
  .tag-open{ font-size:11px; font-weight:600; color:var(--green-dark); background:var(--green-light); border-radius:var(--r-pill); padding:2px 8px; }

  /* ---------- histórico ao tocar ---------- */
  .hist-panel{ animation:fade .18s ease; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .hist-inner{ background:var(--surface-2); border-radius:12px; padding:14px; margin:4px 0 6px; }
  .hist-top{ font-size:13.5px; font-weight:500; color:var(--ink); margin-bottom:10px; line-height:1.4; }
  .hist-resumo{ font-size:13px; color:var(--mut); margin-bottom:10px; }
  .hist-resumo b{ color:var(--ink); }
  .hist-lista{ display:flex; flex-wrap:wrap; gap:6px; }
  .h-row{ display:flex; align-items:center; gap:5px; font-size:13px; font-weight:500;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-pill); padding:4px 10px; }
  .h-data{ color:var(--mut); }
  .h-up{ color:var(--red); } .h-down{ color:var(--green); } .h-flat{ color:var(--faint); }
  .hist-vazio{ font-size:13px; color:var(--mut); line-height:1.5; }

  /* ---------- economia (cesta) ---------- */
  .eco{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--sh);
    padding:26px 24px; text-align:center; margin-bottom:16px; }
  .eco-lbl{ font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); }
  .eco-num{ font-size:46px; font-weight:700; color:var(--green); line-height:1.05; letter-spacing:-.02em; margin:8px 0 6px; }
  .eco-sub{ font-size:14.5px; color:var(--mut); margin:0 auto; max-width:420px; }
  .eco-det{ margin-top:16px; }
  .eco-det>summary{ list-style:none; cursor:pointer; font-size:13px; color:var(--focus); display:inline-flex; align-items:center; gap:5px; }
  .eco-det>summary::-webkit-details-marker{ display:none; }
  .eco-fonte{ font-size:13px; color:var(--mut); line-height:1.55; margin:12px auto; max-width:520px; text-align:left; }
  .eco-lista{ list-style:none; margin:12px 0 0; padding:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; text-align:left; }
  .eco-lista li{ display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:11px 14px; border-bottom:1px solid var(--line); align-items:center; }
  .eco-lista li:last-child{ border-bottom:none; }
  .eco-lista li:nth-child(even){ background:var(--surface-2); }
  .eco-lista li b{ grid-row:1/span 2; grid-column:2; color:var(--green-dark); font-weight:700; white-space:nowrap; }
  .ed-nome{ font-size:13.5px; font-weight:500; } .ed-q{ color:var(--mut); font-weight:600; }
  .ed-txt{ font-size:12.5px; color:var(--mut); }

  /* comparação 1 loja vs otimizada */
  .vs{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:stretch; margin-bottom:14px; }
  @media(max-width:560px){ .vs{ grid-template-columns:1fr; } .vs .vs-mid{ transform:rotate(90deg); } }
  .vs-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:18px; }
  .vs-card.best{ border-color:var(--green); background:var(--green-light); }
  .vs-tag{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
  .vs-card.best .vs-tag{ color:var(--green-dark); }
  .vs-mkt{ display:flex; align-items:center; gap:7px; margin-top:8px; font-size:14px; color:var(--ink); }
  .vs-val{ font-size:28px; font-weight:700; color:var(--ink); letter-spacing:-.02em; margin-top:6px; }
  .vs-sub{ font-size:13px; color:var(--mut); margin-top:4px; }
  .vs-mid{ align-self:center; color:var(--faint); font-size:13px; font-weight:500; padding:0 4px; }
  .btn-primary{ width:100%; height:50px; border:none; border-radius:var(--r-btn); background:var(--green); color:var(--on-green);
    font-size:15px; font-weight:600; cursor:pointer; box-shadow:var(--sh-sm); display:inline-flex; align-items:center; justify-content:center; gap:8px; margin-bottom:6px; }
  .btn-primary:hover{ background:var(--green-dark); }

  /* compra otimizada — grupos por mercado */
  .grp{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:14px 16px; margin-bottom:10px; }
  .grp-h{ display:flex; align-items:center; gap:9px; }
  .grp-h .nm{ font-size:14.5px; font-weight:600; color:var(--ink); }
  .grp-h .n{ font-size:12.5px; color:var(--mut); }
  .grp-h .sub{ margin-left:auto; font-weight:700; color:var(--green-dark); }
  .grp-i{ display:flex; justify-content:space-between; gap:10px; font-size:13.5px; color:var(--ink); padding:6px 0 6px 33px; border-top:1px solid var(--line); margin-top:8px; }
  .grp-i:first-of-type{ border-top:none; }
  .grp-i .p{ color:var(--mut); white-space:nowrap; }

  /* ranking de mercados */
  .mrank{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; margin-bottom:10px; }
  .mrank-row{ display:flex; align-items:center; gap:11px; padding:13px 16px; border-bottom:1px solid var(--line); }
  .mrank-row:last-child{ border-bottom:none; }
  .mrank-medal{ font-size:19px; width:26px; text-align:center; flex:0 0 auto; }
  .mrank-info{ flex:1; min-width:0; }
  .mrank-nm{ font-size:14.5px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .mrank-sub{ font-size:12.5px; color:var(--mut); margin-top:2px; }
  .mrank-falta{ color:var(--red); }
  .mrank-val{ text-align:right; flex:0 0 auto; }
  .mrank-val .t{ font-size:15px; font-weight:700; color:var(--ink); }
  .mrank-val .t.muted{ color:var(--mut); font-weight:600; }
  .mrank-val .d{ font-size:12px; color:var(--red); margin-top:1px; }
  .mrank-val .d.ok{ color:var(--green-dark); font-weight:600; }
  .mrank-val .d.muted{ color:var(--faint); }
  .mrank-cover{ font-size:11.5px; font-weight:600; color:var(--mut); background:var(--surface-2); border-radius:var(--r-pill); padding:1px 8px; }
  .mrank-cover.full{ color:var(--green-dark); background:var(--green-light); }
  .mrank-row.parcial{ background:var(--surface-2); }
  .mrank-nota{ font-size:13px; color:var(--mut); line-height:1.5; margin:0 2px 10px; }
  .mrank-nota .tred{ color:var(--red); }

  /* ---------- lista de compras (cesta) ---------- */
  .li-progress{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--mut); margin:2px 2px 12px; }
  .li-progress .bar{ flex:1; height:7px; background:var(--surface-2); border-radius:var(--r-pill); overflow:hidden; }
  .li-progress .bar span{ display:block; height:100%; background:var(--green); transition:width .2s; }
  .li{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:12px 14px; margin-bottom:10px;
    display:flex; align-items:center; gap:12px; }
  .li.done{ opacity:.6; } .li.done .li-nome{ text-decoration:line-through; }
  .chk{ width:22px; height:22px; accent-color:var(--green); cursor:pointer; flex:0 0 auto; }
  .li .thumb{ width:52px; height:52px; }
  .li-body{ flex:1; min-width:0; }
  .li-nome{ font-size:14.5px; font-weight:600; color:var(--ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .li-menor{ font-size:13px; color:var(--mut); margin-top:2px; }
  .li-menor b{ color:var(--green-dark); }
  .li-alert{ font-size:12.5px; color:var(--mut); margin-top:5px; display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .li-alert.on{ color:var(--green-dark); }
  .li-alert.on b{ color:var(--green-dark); }
  .queda{ color:var(--green-dark); font-weight:600; }
  .alvo-in{ width:88px; height:34px; padding:0 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface);
    color:var(--ink); font-size:13px; }
  .alvo-in:focus-visible{ border-color:var(--green); outline:none; box-shadow:0 0 0 3px var(--green-light); }
  .li-act{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .stepper{ display:flex; align-items:center; gap:4px; }

  /* ---------- botão de tema ---------- */

    opacity:0; animation:ovIn .18s ease forwards; }

  /* veredito "está barato?" */

  .verdict.alto{ background:var(--red-soft); border-color:transparent; } .verdict.alto .vdot{ background:var(--red); }

    cursor:pointer; padding:6px 12px; border-radius:var(--r-pill); white-space:nowrap; }

  .chart-wrap{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:14px 12px 8px; }
  .chart-wrap svg{ display:block; width:100%; height:130px; overflow:visible; }

  .chart-tip[hidden]{ display:none; }
  .chart-vazio{ color:var(--mut); font-size:13px; text-align:center; padding:30px 10px; }
  .resumo{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  .resumo .r .l{ font-size:11.5px; color:var(--mut); } .resumo .r .v{ font-size:15px; font-weight:600; color:var(--ink); margin-top:1px; }

  .btn-sm{ height:34px; padding:0 14px; border:none; border-radius:8px; background:var(--green); color:var(--on-green);

  /* ============ MOBILE FIRST (≤767px) ============ */
  @media(max-width:767px){

    .stepper button{ width:40px; height:40px; } .qin{ height:40px; width:48px; }

  /* ============ conta / assinatura / paywall (experiência do usuário) ============ */

  /* meus mercados */

  .mkt-row .nm{ flex:1; font-size:14px; font-weight:600; color:var(--ink); }

  .onb-sub{ font-size:13.5px; color:var(--mut); text-align:center; line-height:1.45; margin:0 0 16px; }

  .onb-tile{ position:relative; display:flex; align-items:center; gap:9px; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-btn); padding:10px 11px; cursor:pointer; transition:border-color .12s, background .12s; }

  .lm-seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-pill); padding:3px; gap:2px; }
  .lm-seg button{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 15px; border:none; background:transparent; color:var(--mut); font-weight:700; font-size:13px; border-radius:var(--r-pill); cursor:pointer; }
  .lm-seg button svg{ width:14px; height:14px; }

  .lm-hint{ font-size:12px; color:var(--mut); text-align:center; }
  .lm-empty{ background:var(--surface-2); border:1px dashed var(--line); border-radius:var(--r-card); padding:16px; text-align:center; color:var(--mut); font-size:14px; margin-bottom:14px; }
  .fav-star{ display:inline-flex; vertical-align:-2px; } .fav-star svg{ width:14px; height:14px; color:var(--yellow); fill:var(--yellow); }

  /* preço ancorado + trial + segmentado + ROI */
  .assine-card .de-preco{ font-size:18px; font-weight:600; color:var(--faint); text-decoration:line-through; margin-right:6px; }
  .assine-card .preco-anual{ font-size:13.5px; color:var(--mut); margin-top:4px; }

  .assine-card .sub2{ font-size:13px; color:var(--mut); margin:.2em 0 0; }
  .assine-card .roi{ display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--green-dark); background:var(--green-light); border-radius:var(--r-btn); padding:10px 12px; margin:6px 0 12px; }

  .trial-chip{ display:inline-block; font-size:12.5px; font-weight:600; color:var(--green-dark); background:var(--green-light); border-radius:var(--r-pill); padding:4px 12px; margin-bottom:10px; }

  /* modal de login (clímax, não é a primeira tela) */

  .modal-x{ position:absolute; top:12px; right:12px; width:32px; height:32px; border:none; background:var(--surface-2); color:var(--mut); border-radius:var(--r-pill); cursor:pointer; font-size:15px; }
  .auth-brand{ display:flex; justify-content:center; margin-bottom:2px; } .auth-brand h2{ margin:0; font-size:24px; font-weight:800; letter-spacing:-.02em; color:var(--green-dark); } .auth-brand h2 .p2{ color:var(--green); }

  .auth-btn{ width:100%; height:48px; border:none; border-radius:var(--r-btn); background:var(--green); color:var(--on-green); font-weight:700; font-size:15px; cursor:pointer; margin-top:2px; }

  /* toast */
  .toast{ position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); z-index:130; background:var(--ink); color:var(--bg);

const CAT_ICON={mercearia:"cat_mercearia",bebidas:"cat_bebidas",limpeza:"cat_limpeza",higiene:"cat_higiene",laticinios:"cat_laticinios"};
const FRESCO_ICON={ofertas:"cat_oferta",carnes:"cat_carnes",bandeja:"cat_carnes",hortifruti:"cat_hortifruti",peixes:"cat_peixes",frios:"cat_frios",outros:"cat_outros"};

/* ---------- helpers (formatação / util) ---------- */
const brl=v=> v==null? "—" : "R$ "+Number(v).toFixed(2).replace(".",",");
const ppuFmt=(v,rot)=> v==null? "" : "R$ "+Number(v).toFixed(2).replace(".",",")+" "+(rot||"");
const dataCurta=iso=>{ const d=new Date(iso); return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}); };
function relTempo(iso){ if(!iso) return "—";
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<3600) return "há "+Math.max(1,Math.round(s/60))+" min";
  if(s<86400) return "há "+Math.round(s/3600)+"h";
  const d=Math.round(s/86400); return "há "+d+(d===1?" dia":" dias");
}
function classeFrescor(iso){ if(!iso) return "fresc-old";
  const h=(Date.now()-new Date(iso).getTime())/3600000;
  return h<12?"fresc-ok":h<36?"fresc-mid":"fresc-old"; }
function embalagem(q,u){ if(q==null||!u) return "";
  if(u==="kg") return q<1? Math.round(q*1000)+" g" : (""+q).replace(".",",")+" kg";
  if(u==="l")  return q<1? Math.round(q*1000)+" ml" : (""+q).replace(".",",")+" L";
  return (q%1?q.toFixed(0):q)+" un"; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hrefSeguro(url){ const u=String(url??"").trim(); return /^https?:\/\//i.test(u)?u:null; }
function iniciais(n){ const p=n.trim().split(/\s+/); return ((p[0]?.[0]||"")+(p[1]?.[0]||p[0]?.[1]||"")).toUpperCase(); }
function corTexto(hex){ if(!hex) return "#fff"; const h=hex.replace("#","");
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b)/255>0.6? "#17211c":"#fff"; }
function thumb(url,alt){ const u=hrefSeguro(url); return u
  ? `<img class="thumb" src="${esc(u)}" alt="" loading="lazy" onerror="this.dataset.noImage='true'">`
  : `<span class="thumb" data-no-image="true" aria-hidden="true"></span>`; }
let MKT_LOGO={}; // slug/nome -> URL da logo (carregado de /mercados no init)
function badgeMini(m){ const c=m.cor_badge||"#8a8a8a";
  const logo=(m.mercado_slug&&MKT_LOGO[m.mercado_slug])||(m.slug&&MKT_LOGO[m.slug])||MKT_LOGO[m.nome];
  if(logo) return `<span class="badge badge-logo" title="${esc(m.nome||"")}" aria-hidden="true"><img src="${esc(logo)}" alt="" loading="lazy"></span>`;
  return `<span class="badge" style="width:22px;height:22px;font-size:10px;background:${c};color:${corTexto(c)}" aria-hidden="true">${esc(iniciais(m.nome))}</span>`; }
function verLink(url,mkt){ const u=hrefSeguro(url); return u?`<a class="ver-site" href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="Ver no site do ${esc(mkt)} (abre em nova aba)">${ic("external")}</a>`:""; }
function verLinkTxt(url,mkt){ const u=hrefSeguro(url); return u?`<a class="ver-txt" href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="Ver no site do ${esc(mkt)} (abre em nova aba)">ver no site ${ic("external")}</a>`:`<span class="ver-txt off">sem link</span>`; }
// Selo do PROGRAMA exigido: quando o preço só vale com clube/fidelidade/cartão, o
// oferta_tipo guarda o NOME do programa (ex.: "Viva", "Fidelidade") e vira um selo.
// "oferta" (ou vazio) = preço pra todos -> SEM selo (a ausência já diz "não precisa de cartão").
function seloOferta(x){
  const t=x.oferta_tipo;
  if(!t || t==="oferta") return "";
  return `<span class="tag-fid" title="Esse preço só vale com o ${esc(t)} do mercado — não é o preço pra todo mundo">🪪 ${esc(t)}</span>`;
}
function badgesPromo(x){
  const b=[];
  if(x.desconto_pct) b.push(`<span class="tag-off">${x.desconto_pct}% OFF${x.preco_de?` · de ${brl(x.preco_de)}`:""}</span>`);
  const sel=seloOferta(x); if(sel) b.push(sel);
  if(x.so_no_site) b.push(`<span class="tag-site">só no site</span>`);
  return b.length?`<div class="promo-tags">${b.join("")}</div>`:"";
}

/* ---------- histórico de preço (tocar no mercado) ---------- */
let HIST_CACHE={};
function histChartSVG(pts){
  const w=280,h=60,pad=6,mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1,st=(w-2*pad)/(pts.length-1);
  const xy=pts.map((p,i)=>[pad+i*st,h-pad-((p-mn)/rg)*(h-2*pad)]);
  const line=xy.map(c=>`${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(" ");
  const area=`${pad},${h-pad} ${line} ${(w-pad).toFixed(1)},${h-pad}`;
  const last=xy[xy.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Evolução do preço">
    <polygon fill="var(--green-light)" points="${area}"/>
    <polyline fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round" points="${line}"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--green)"/></svg>`;
}
function histHTML(s,mercado){
  if(!s||!s.pontos||s.pontos.length<2)
    return `<div class="hist-vazio">Ainda não temos preços de dias anteriores no <b>${esc(mercado)}</b>. O histórico vai aparecendo conforme o app coleta, dia após dia.</div>`;
  const pts=s.pontos.slice(-30), precos=pts.map(p=>p.preco);
  const mn=Math.min(...precos), mx=Math.max(...precos), cur=precos[precos.length-1], ini=precos[0];
  const dif=cur-ini, seta=dif<0?`<span class="h-down">↓ caiu ${brl(Math.abs(dif))}</span>`:dif>0?`<span class="h-up">↑ subiu ${brl(dif)}</span>`:`<span class="h-flat">→ estável</span>`;
  const recent=pts.slice(-8).reverse();
  const linhas=recent.map((p,i,arr)=>{ const prev=arr[i+1];
    const a=prev?(p.preco<prev.preco?`<span class="h-down">↓</span>`:p.preco>prev.preco?`<span class="h-up">↑</span>`:`<span class="h-flat">→</span>`):"";
    return `<div class="h-row num"><span class="h-data">${dataCurta(p.coletado_em)}</span><span>${brl(p.preco)}</span>${a}</div>`; }).join("");
  return `<div class="hist-inner">
    <div class="hist-top">${ic("chart")} Preço nos últimos ${pts.length} dias no <b>${esc(mercado)}</b> — ${seta} desde ${dataCurta(pts[0].coletado_em)}</div>
    <div style="margin-bottom:10px">${histChartSVG(precos)}</div>
    <div class="hist-resumo num">menor <b>${brl(mn)}</b> · maior <b>${brl(mx)}</b> · agora <b>${brl(cur)}</b></div>
    <div class="hist-lista">${linhas}</div>
  </div>`;
}
async function toggleHistorico(ean,mercado,btn){
  const row=btn.closest(".rank-row")||btn.closest(".mrow")||btn.closest(".row"), aberto=row.nextElementSibling;
  if(aberto&&aberto.classList.contains("hist-panel")){ aberto.remove(); btn.setAttribute("aria-expanded","false"); return; }
  btn.setAttribute("aria-expanded","true");
  const panel=document.createElement("li"); panel.className="hist-panel"; panel.style.listStyle="none";
  panel.innerHTML=`<div class="hist-inner"><div class="hist-top">Carregando histórico…</div></div>`;
  row.after(panel);
  try{ let d=HIST_CACHE[ean];
    if(!d){ d=await fetch(`${API}/historico/${encodeURIComponent(ean)}`).then(r=>r.json()); HIST_CACHE[ean]=d; }
    const s=(d.series||[]).find(x=>x.mercado===mercado);
    panel.innerHTML=histHTML(s,mercado);
  }catch(e){ panel.innerHTML=`<div class="hist-inner"><div class="hist-vazio">Não consegui carregar o histórico agora.</div></div>`; }
}

/* ---------- drawer de produto (detalhe + histórico) ---------- */
let DRAWER={ean:null,hist:null,periodo:30,mercado:null,cheap:null};
const PERIODOS=[{d:7,l:"7 dias"},{d:14,l:"14 dias"},{d:30,l:"30 dias"},{d:90,l:"3 meses"}];
function _serie(m){ return (DRAWER.hist?.series||[]).find(s=>s.mercado===m)?.pontos||[]; }
function _janela(pts,dias){ const lim=Date.now()-dias*86400000; return pts.filter(p=>new Date(p.coletado_em).getTime()>=lim); }
function _variacao(pts,dias){ const f=_janela(pts,dias); if(f.length<2) return null;
  const a=f[0].preco, b=f[f.length-1].preco, abs=b-a; return {abs,pct:a?abs/a*100:0,dir:abs<-0.001?"down":abs>0.001?"up":"flat"}; }
function _veredito(pts){ const f=_janela(pts,30); if(f.length<4) return null;
  const cur=f[f.length-1].preco, avg=f.reduce((s,p)=>s+p.preco,0)/f.length, pct=avg?(cur-avg)/avg*100:0;
  if(pct<=-5) return {c:"bom",t:"Preço bom",s:`${Math.abs(pct).toFixed(1).replace(".",",")}% abaixo da média dos últimos 30 dias`};
  if(pct>=5)  return {c:"alto",t:"Preço alto",s:`${pct.toFixed(1).replace(".",",")}% acima da média dos últimos 30 dias`};
  return {c:"normal",t:"Preço normal",s:"próximo da média dos últimos 30 dias"}; }
function _pontoEm(pts,dias){ if(!pts.length) return null; const alvo=Date.now()-dias*86400000;
  let best=null,bd=Infinity; pts.forEach(p=>{ const d=Math.abs(new Date(p.coletado_em).getTime()-alvo); if(d<bd){bd=d;best=p;} }); return best; }
function _pontosChave(){
  const pts=_serie(DRAWER.mercado); if(pts.length<2) return "";
  const hoje=pts[pts.length-1], p7=_pontoEm(pts,7), p30=_pontoEm(pts,30);
  const linha=(l,p)=> p?`<div class="pt"><span class="l">${l}</span><span class="v num">${brl(p.preco)}</span></div>`:"";
  return `<div class="dp-pontos">${linha("Hoje",hoje)}${(p7&&p7!==hoje)?linha("7 dias atrás",p7):""}${(p30&&p30!==hoje&&p30!==p7)?linha("30 dias atrás",p30):""}</div>`;
}
async function abrirProduto(ean){
  try{
    const [prod,hist]=await Promise.all([
      fetch(`${API}/produto/${encodeURIComponent(ean)}`).then(r=>r.json()),
      fetch(`${API}/historico/${encodeURIComponent(ean)}`).then(r=>r.json())
    ]);
    const rk=prod.ranking||[];
    DRAWER={ean,hist,periodo:30,mercado:rk[0]?.mercado||null,cheap:rk[0]?.mercado||null,prod};
    renderDrawer(prod);
  }catch(e){ /* ignora */ }
}
function fecharProduto(ev){ if(ev&&ev.target!==ev.currentTarget) return;
  const ov=$("#drawerOv"); if(ov) ov.remove(); document.removeEventListener("keydown",_escFecha); }
function _escFecha(e){ if(e.key==="Escape") fecharProduto(); }
function renderDrawer(prod){
  const rk=prod.ranking||[], best=rk[0];
  const prem=acessoPremium();   // grátis não vê OS MERCADOS (o "onde"), só o menor preço
  const naCesta=CESTA_EANS.has(prod.ean);

  const ver=_veredito(cheapPts);
  const verHTML=ver?`<div class="verdict ${ver.c}"><span class="vdot"></span><div><div class="vt">${ver.t}</div><div class="vs">${ver.s}</div></div></div>`:"";

  const perTabs=`<div class="tabs" id="drPer">${PERIODOS.map(p=>`<button class="tab ${p.d===DRAWER.periodo?"on":""}" onclick="drSetPeriodo(${p.d})">${p.l}</button>`).join("")}</div>`;
  const cmp=rk.map((l,i)=>`<li class="${i===0?"best":""}">${badgeMini({nome:l.mercado,cor_badge:l.cor_badge})}<span class="nm">${esc(l.mercado)}</span>${i===0?'<span class="best-lbl">menor preço</span>':""}<span class="pr num">${brl(l.preco)}</span>${verLinkTxt(l.url,l.mercado)}</li>`).join("");
  const ov=document.createElement("div"); ov.className="drawer-ov"; ov.id="drawerOv";

    <div class="drawer-scroll">
      <h2 class="dp-nome">${esc(prod.nome)}</h2>
      <div class="dp-price-lbl">Menor preço hoje</div>
      <div class="dp-preco num">${brl(prod.menor_preco)}</div>
      ${best?(prem
        ? `<div class="dp-mkt">${badgeMini({nome:best.mercado,cor_badge:best.cor_badge})} ${esc(best.mercado)}</div>`
        : `<div class="dp-mkt oculto">${ic("lock")} <span>desbloqueie pra ver o mercado</span></div>`):""}
      ${varHTML}${verHTML}
      <div class="dp-sec">Histórico de preço</div>
      ${perTabs}${mktTabs}
      <div id="drChart"></div>

      ${prem
        ? `<ul class="cmp">${cmp}</ul>`
        : `<div class="cmp-lock">

              <button class="pw-cta" type="button" onclick="desbloquear()">${ic("crown")} ${trialJaUsado()?"Assine e desbloqueie":`Cadastre-se — ${TRIAL_DIAS} dias grátis`}</button>
              <div class="pw-fine">${trialJaUsado()?`a partir de ${PRECO_MENSAL}/mês`:`${TRIAL_DIAS} dias grátis · sem cartão`}</div>

function drSetPeriodo(d){ DRAWER.periodo=d; document.querySelectorAll("#drPer .tab").forEach((b,i)=>b.classList.toggle("on",PERIODOS[i].d===d)); drRenderChart(); }
function drSetMercado(m){ DRAWER.mercado=m; document.querySelectorAll("#drMkts .tab").forEach(b=>b.classList.toggle("on",b.textContent===m)); drRenderChart(); }
function drRenderChart(){
  const host=$("#drChart"); if(!host) return;
  const pts=_janela(_serie(DRAWER.mercado),DRAWER.periodo);
  if(pts.length<2){ host.innerHTML=`<div class="chart-wrap"><div class="chart-vazio">Ainda não há preços suficientes de <b>${esc(DRAWER.mercado||"")}</b> nesse período.<br>O histórico cresce conforme o app coleta a cada dia.</div></div>`; return; }
  const precos=pts.map(p=>p.preco), mn=Math.min(...precos), mx=Math.max(...precos), rg=(mx-mn)||1;
  const W=1000,H=130,pad=10,st=(W-2*pad)/(pts.length-1);
  const xy=pts.map((p,i)=>[pad+i*st, H-pad-((p.preco-mn)/rg)*(H-2*pad)]);
  const line=xy.map(c=>`${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(" ");
  const area=`${pad},${H-pad} ${line} ${(W-pad).toFixed(1)},${H-pad}`;
  const dots=xy.map((c,i)=>`<circle class="chart-dot" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="9" fill="transparent" data-i="${i}"/><circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="var(--green)" pointer-events="none"/>`).join("");
  const v=_variacao(pts,DRAWER.periodo);
  const vtxt=v?`<span class="v ${v.dir}">${v.dir==="down"?"↓":v.dir==="up"?"↑":"→"} ${v.dir==="flat"?"estável":brl(Math.abs(v.abs))+" ("+(v.pct<0?"":"+")+v.pct.toFixed(1).replace(".",",")+"%)"}</span>`:"—";
  host.innerHTML=`<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Gráfico de preço">
      <polygon fill="var(--green-light)" points="${area}"/>
      <polyline fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${line}" vector-effect="non-scaling-stroke"/>
      ${dots}
    </svg>
    <div class="chart-tip" id="drTip" hidden></div>
  </div>
  ${_pontosChave()}
  <div class="resumo">
    <div class="r"><div class="l">variação no período</div><div class="v ${v?v.dir:""}">${vtxt}</div></div>
    <div class="r"><div class="l">menor no período</div><div class="v num">${brl(mn)}</div></div>
    <div class="r"><div class="l">maior no período</div><div class="v num">${brl(mx)}</div></div>
  </div>`;
  const svg=host.querySelector("svg"), tip=$("#drTip"), wrap=host.querySelector(".chart-wrap");
  svg.querySelectorAll(".chart-dot").forEach(dot=>{
    const show=()=>{ const i=+dot.dataset.i, p=pts[i], rect=wrap.getBoundingClientRect();
      const cx=dot.getBoundingClientRect().left-rect.left+ (dot.getBoundingClientRect().width/2);
      const cy=dot.getBoundingClientRect().top-rect.top;
      tip.innerHTML=`<div class="d">${dataCurta(p.coletado_em)}</div><div>${esc(DRAWER.mercado)}</div><div class="p num">${brl(p.preco)}</div>`;
      tip.style.left=cx+"px"; tip.style.top=cy+"px"; tip.hidden=false; };
    dot.addEventListener("mouseenter",show); dot.addEventListener("click",show);
    dot.addEventListener("mouseleave",()=>{ tip.hidden=true; });
  });
}

/* ---------- card de produto (e-commerce) + ranking de preços ---------- */

    </button>

function toggleLojas(rid,btn){

function cardProduto(p){

  const naCesta=CESTA_EANS.has(p.ean);
  const best=rk[0];

  const price=`<div class="prod-price">
      <span class="lbl-menor">menor preço</span>

function blocoPereciveis(per){
  return `<div class="sec-title">${ic("cat_carnes")} Frescos e por peso <span class="muted">preço casado por nome</span></div>
    <p class="per-nota">Carnes, hortifrúti e padaria não têm código de barras universal — o preço é casado pelo nome e pode variar conforme peso ou corte.</p>
    ${per.map(cardPerecivel).join("")}`;
}
function uniRot(rot,uni){ // "R$/kg" -> " /kg" ; fallback pra unidade do item
  if(rot) return " "+rot.replace(/R\$/,"").trim();
  return uni?` /${esc(uni)}`:"";
}
function idadeMkt(ce){ // idade do preço DAQUELE mercado (não do grupo) — cor por frescor
  return ce?`<span class="per-idade ${classeFrescor(ce)}" title="preço coletado ${relTempo(ce)}">${relTempo(ce)}</span>`:"";
}
function cardPerecivel(g,ord,modo){
  const bandeja=modo==="bandeja";
  // a ordem das lojas dentro do card segue o filtro: barato->caro (padrão) ou caro->barato
  const precos=(ord==="desc")?g.precos.slice().reverse():g.precos;
  const menorKg=g.menor_preco, multi=precos.length>1;
  const uG=uniRot(g.rotulo,g.unidade);
  const lojas=precos.map(p=>{
    const val=p.comp!=null?p.comp:p.preco;   // preço/kg comparável
    const uKg=uniRot(p.rotulo,g.unidade);
    const barata=(multi && Math.abs(val-menorKg)<0.005)?`<span class="per-flag">${bandeja?"melhor /kg":"mais barata"}</span>`:"";
    const idade=idadeMkt(p.coletado_em);
    if(bandeja){ // bandeja: preço do PACOTE em destaque, /kg ao lado
      const perkg=(p.comp!=null)?`<span class="per-raw" title="equivale por kg">${brl(p.comp)}${uKg}</span>`:"";
      return `<div class="per-loja">${badgeMini({nome:p.mercado,cor_badge:p.cor_badge})}<span class="nm">${esc(p.mercado)}</span><b class="num">${brl(p.preco)}</b>${perkg}${barata}${verLink(p.url,p.mercado)}${idade}</div>`;
    }
    const raw=(p.preco!=null && Math.abs(p.preco-val)>0.01)?`<span class="per-raw" title="preço de prateleira">${brl(p.preco)}</span>`:"";
    return `<div class="per-loja">${badgeMini({nome:p.mercado,cor_badge:p.cor_badge})}<span class="nm">${esc(p.mercado)}</span><b class="num">${brl(val)}${uKg}</b>${raw}${barata}${verLink(p.url,p.mercado)}${idade}</div>`;
  }).join("");
  // rodapé mostra a idade do preço MAIS ANTIGO do grupo (conservador, não engana)
  const idades=precos.map(p=>p.coletado_em).filter(Boolean);
  const velho=idades.length?idades.reduce((a,b)=>a<b?a:b):null;
  const fresc=velho?`<div class="per-fresc ${classeFrescor(velho)}">preço mais antigo: ${relTempo(velho)}</div>`:"";
  const promo=g.precos.length?badgesPromo(g.precos[0]):"";
  const naLista=g.chave&&CESTA_EANS.has("f:"+g.chave);
  const addBtn=g.chave?`<button class="per-add ${naLista?"in":""}" type="button" data-chave="${esc(g.chave)}" data-nome="${esc(g.nome)}" onclick="addFrescoBtn(this)">${naLista?"✓ na lista":"+ lista"}</button>`:"";
  const right=bandeja
    ? `<span class="lbl-menor">bandeja a partir de</span><div class="per-preco num">${brl(g.menor_pacote)}</div><span class="per-sub num">${brl(g.menor_preco)}${uG} melhor</span>`
    : `<span class="lbl-menor">a partir de</span><div class="per-preco num">${brl(g.menor_preco)}${uG}</div>`;
  return `<div class="per-card">${thumb(g.imagem_url,g.nome)}
    <div class="per-main"><div class="prod-nome">${esc(g.nome)}</div><div class="per-lojas">${lojas}</div>${promo}${fresc}</div>
    <div class="per-right">${right}${addBtn}</div>
  </div>`;
}
function cardOferta(o){
  const uni=o.unidade?`<span class="per-uni"> /${esc(o.unidade)}</span>`:"";
  const de=o.preco_de?`<div class="per-de num">${brl(o.preco_de)}</div>`:"";
  return `<div class="per-card">${thumb(o.imagem_url,o.nome)}
    <div class="per-main"><div class="prod-nome">${esc(o.nome)}</div>
      <div class="per-loja">${badgeMini({nome:o.mercado,cor_badge:o.cor_badge})}<span class="nm">${esc(o.mercado)}</span>${verLink(o.url,o.mercado)}</div>
      ${badgesPromo(o)}</div>
    <div class="per-right">${de}<div class="per-preco num">${brl(o.preco)}${uni}</div></div>
  </div>`;
}

let FRESCOS_STATE={its:[],nome:"",slug:"",ord:"rel"};
const FRESCOS_ORD=[["rel","Mais relevante"],["asc","Menor preço"],["desc","Maior preço"]];
function ordenarFrescos(its,ord){
  const a=its.slice();
  if(ord==="asc") a.sort((x,y)=>x.menor_preco-y.menor_preco);
  else if(ord==="desc") a.sort((x,y)=>y.menor_preco-x.menor_preco);
  else a.sort((x,y)=>(y.n_mercados-x.n_mercados)||(x.nome||"").localeCompare(y.nome||"")); // relevância = mais lojas comparadas
  return a;
}

/* ---------- cesta / feira do usuário (persistida no Supabase, com RLS por dono) ---------- */
let CESTA_EANS=new Set();
async function tokenAtual(){ if(!sb||!SESSAO) return null; try{ const {data}=await sb.auth.getSession(); return data.session?data.session.access_token:null; }catch(e){ return null; } }
// fetch com o token do usuário no header (o /cesta lê a feira dele + aplica a trava no servidor)
async function fetchAuth(url,opts){ opts=opts||{}; const t=await tokenAtual(); opts.headers=Object.assign({},opts.headers||{},t?{Authorization:"Bearer "+t}:{}); return fetch(url,opts); }
// upsert/delete de um item da feira, direto no Supabase (RLS garante que é só a do dono)
async function listaSet(ean,campos){
  if(!sb||!SESSAO) return false;
  const {error}=await sb.from("lista").upsert(Object.assign({user_id:SESSAO.user.id,ean},campos),{onConflict:"user_id,ean"});
  if(error) console.warn("lista upsert:",error.message);
  return !error;
}
async function listaDel(ean){ if(sb&&SESSAO) await sb.from("lista").delete().eq("user_id",SESSAO.user.id).eq("ean",ean); }

async function addCesta(ean,btn){
  if(!estaLogado()){ abrirLogin(()=>addCesta(ean,btn)); return; }   // feira exige conta (força cadastro)
  const ok=await listaSet(ean,{quantidade:1,comprado:false});
  if(ok){ CESTA_EANS.add(ean); if(btn){ btn.textContent="✓"; btn.classList.add("in"); } atualizarBadge(); }
  else if(btn){ btn.textContent="!"; }
}

async function removerCesta(ean,el){
  await listaDel(ean); CESTA_EANS.delete(ean); atualizarBadge();
  // remove a linha NA HORA (sem re-renderizar tudo) -> não pula pro topo, mantém o scroll
  const li=el?el.closest(".li"):document.querySelector(`.li[data-ean="${(window.CSS&&CSS.escape)?CSS.escape(ean):ean}"]`);

  const pt=document.querySelector(".li-progress .txt"); if(pt) pt.textContent=`${done} de ${restantes} no carrinho`;
  const pb=document.querySelector(".li-progress .bar span"); if(pb) pb.style.width=(restantes?Math.round(done/restantes*100):0)+"%";
}

  if(!SESSAO) return;

  try{ await sb.from("lista").delete().eq("user_id",SESSAO.user.id); }catch(e){}

/* explica, item a item, de onde vem cada real economizado */
function ecoDetalhe(d){
  const linhas=[];
  (d.itens||[]).forEach(it=>{
    if(!it.melhor) return;
    const nome=esc((it.nome||"").split(" ").slice(0,5).join(" "));
    const q=(it.quantidade>1)?` <span class="ed-q">×${it.quantidade}</span>`:"";
    if(it.economia_mercados_item>0){
      const precos=(it.precos||[]).map(p=>p.preco); const caro=precos.length?Math.max(...precos):null;
      linhas.push(`<li><div class="ed-nome">${nome}${q}</div><div class="ed-txt">${brl(it.melhor.preco)} no ${esc(it.melhor.mercado)}, até ${brl(caro)} em outra loja</div><b class="num">${brl(it.economia_mercados_item)}</b></li>`);
    }
    if(it.economia_dias_item>0&&it.preco_ref_dias){
      linhas.push(`<li><div class="ed-nome">${nome}${q}</div><div class="ed-txt">caiu de ${brl(it.preco_ref_dias)} para ${brl(it.melhor.preco)}</div><b class="num">${brl(it.economia_dias_item)}</b></li>`);
    }
  });
  if(!linhas.length) return "";
  return `<details class="eco-det"><summary>Como calculamos</summary>
    <p class="eco-fonte">Usamos os preços online que o app coleta em cada mercado todo dia. O cálculo é feito item por item — a diferença entre a loja mais barata e a mais cara, mais quedas de preço recentes:</p>
    <ul class="eco-lista">${linhas.join("")}</ul></details>`;
}
/* ranking de mercados (comprando tudo numa loja só) */
function rankingMercados(d){
  // COMPARAÇÃO JUSTA: só lojas onde dá pra fazer a feira (falta pouco), pelo total da FEIRA
  // INTEIRA (o que a loja tem + o que falta pelo menor preço fora). Já vem ordenado do servidor.
  const mkts=(d.mercados||[]).filter(m=>m.viavel);
  if(!mkts.length) return "";
  const min=mkts[0].completo_total;
  const medal=["🥇","🥈","🥉"];
  const linhas=mkts.slice(0,6).map((m,i)=>{
    const diff=m.completo_total-min;
    const extra=i===0
      ? `<div class="d ok">mais barata pra sua feira</div>`
      : `<div class="d num">R$ ${diff.toFixed(2).replace(".",",")} a mais</div>`;
    const sub=m.completo
      ? `tem todos os ${d.n_itens} itens`
      : `tem ${m.cobertura}, + ${m.faltam} ${m.faltam===1?"item pego":"itens pegos"} no mais barato fora`;
    return `<div class="mrank-row">
      <span class="mrank-medal">${medal[i]||"·"}</span>

    const semMeus=(modo==="meus"&&favs.length&&!(d.mercados||[]).some(m=>m.viavel));

      </div>${modo==='meus'?`<div class="lm-hint">Comparando só os ${favs.length} mercado${favs.length>1?"s":""} que você marcou como seus.</div>`:""}</div>`:"";
    if(semMeus){ miolo=`<div class="lm-empty">Nenhum dos seus mercados cobre esta feira o suficiente pra comparar. Toque em <b>Todos os mercados</b> acima pra ver todas as lojas.</div>`; }

    const listaTitle=`<div class="sec-title lista-hd"><span>Minha lista <span class="muted">${d.n_itens} ${d.n_itens===1?"produto":"produtos"} · marque o que já pegou</span></span><button class="li-esvaziar" type="button" onclick="esvaziarLista()">${ic("trash")} Esvaziar</button></div>`;

  }catch(e){ saida.innerHTML=`<p class="state">Erro ao carregar a lista.</p>`; }
}

async function authSubmit(ev){ ev.preventDefault();
  const email=($("#aEmail").value||"").trim().toLowerCase(), senha=$("#aSenha").value||"";
  const nomeEl=$("#aNome"), nome=nomeEl?(nomeEl.value||"").trim():"";

  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent="Digite um e-mail válido."; return false; }
  if(senha.length<6){ err.textContent="A senha precisa de ao menos 6 caracteres."; return false; }
  if(!sb){ err.textContent="Não conectei ao servidor. Recarregue a página."; return false; }
  err.textContent=""; if(btn){ btn.disabled=true; btn.dataset.txt=btn.textContent; btn.textContent="Aguarde…"; }
  const reset=()=>{ if(btn){ btn.disabled=false; btn.textContent=btn.dataset.txt||"Enviar"; } };
  try{
    let res=criar
      ? await sb.auth.signUp({email, password:senha, options:{data:{nome:nome||email.split("@")[0]}}})
      : await sb.auth.signInWithPassword({email, password:senha});
    if(res.error){ err.textContent=traduzErroAuth(res.error.message); reset(); return false; }
    if(criar && !res.data.session){   // cadastrou sem sessão -> entra na hora (a conta é auto-confirmada)
      const si=await sb.auth.signInWithPassword({email, password:senha});
      if(si.data && si.data.session){ res=si; }
      else { err.textContent="Conta criada! Confirme o link no seu e-mail e depois entre."; reset(); return false; }
    }
    SESSAO=res.data.session;

    fecharLogin(); atualizarContaUI(); atualizarBadge();   // carrega a feira do usuário
    if(criar) abrirOnboarding(cb);    // conta nova -> personaliza (escolher mercados) antes de seguir
    else if(cb) cb();
  }catch(e){ err.textContent="Erro de conexão. Tente de novo."; reset(); }
  return false;
}
function traduzErroAuth(m){
  m=(m||"").toLowerCase();
  if(m.includes("invalid login")) return "E-mail ou senha errados.";
  if(m.includes("already registered")||m.includes("already been registered")||m.includes("user already")) return "Esse e-mail já tem conta. Toque em Entrar.";
  if(m.includes("email not confirmed")) return "Confirme seu e-mail antes de entrar (veja sua caixa de entrada).";
  if(m.includes("password")) return "Senha fraca — use 6+ caracteres.";
  if(m.includes("rate limit")||m.includes("too many")||m.includes("seconds")) return "Muitas tentativas. Espere um minutinho.";
  return "Não deu pra entrar agora. Tente de novo.";
}
async function sair(){ if(sb){ try{ await sb.auth.signOut(); }catch(e){} } SESSAO=null; PERFIL={plano:"gratis",trial_ini:null,trial_usado:false,nome:null}; CESTA_EANS=new Set(); setFavMercados([]); atualizarContaUI(); atualizarBadge(); loadPerfil(); }

/* ------- onboarding de personalização (aparece 1x, logo após CRIAR a conta) -------
   Deixa a pessoa escolher os mercados que usa; viram favoritos (destaque na comparação
   + sync na conta). Rápido e pulável — não é barreira antes de liberar o app. */
let _onbCb=null, _onbSel=null;
function abrirOnboarding(cb){
  const done=(typeof cb==="function")?cb:null;
  if(!MERCADOS.length){ if(done) done(); return; }   // sem mercados carregados: não trava o fluxo
  _onbCb=done; _onbSel=new Set(favMercados());
  renderOnboarding(); $("#onbModal").classList.add("show");
}
function renderOnboarding(){
  const u=usuario(); const nome=(u&&u.nome)?esc(u.nome.split(" ")[0]):"";
  const tiles=[...MERCADOS].map(m=>{
    const on=_onbSel.has(m.slug);
    return `<button type="button" class="onb-tile ${on?"on":""}" aria-pressed="${on}" onclick="onbToggle('${m.slug}')">
      <span class="onb-check">${ic("check")}</span>${badgeMini(m)}<span class="onb-nm">${esc(m.nome)}</span></button>`;
  }).join("");
  const n=_onbSel.size;
  $("#onbBox").innerHTML=`
    <div class="auth-brand"><h2>Pou<span class="p2">Pou</span></h2></div>
    <h3 class="onb-tit">${nome?`Boas-vindas, ${nome}! 🎉`:"Boas-vindas! 🎉"}</h3>
    <p class="onb-sub">Quais supermercados você costuma usar? A gente destaca eles na comparação e mostra onde você economiza.</p>
    <div class="onb-grid">${tiles}</div>
    <button class="auth-btn" type="button" onclick="onbConcluir()">${n?`Continuar com ${n} mercado${n>1?"s":""}`:"Escolha ao menos 1 (ou pule)"}</button>
    <button class="onb-skip" type="button" onclick="onbPular()">Pular por agora</button>`;
}
function onbToggle(slug){ if(_onbSel.has(slug)) _onbSel.delete(slug); else _onbSel.add(slug); renderOnboarding(); }
function onbConcluir(){
  const favs=[...MERCADOS].map(m=>m.slug).filter(s=>_onbSel.has(s));   // ordem estável = ordem da lista
  setFavMercados(favs); salvarFavoritos(); const n=favs.length;
  fecharOnboarding();
  if(n) toast(`${n} mercado${n>1?"s":""} marcado${n>1?"s":""} como seu${n>1?"s":""} ⭐`);
}
function onbPular(){ fecharOnboarding(); }
function fecharOnboarding(){ $("#onbModal").classList.remove("show"); const cb=_onbCb; _onbCb=null; if(typeof cb==="function") cb(); }

function toast(msg){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2800); }

function favMercados(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||"[]"); }catch(e){ return []; } }
function setFavMercados(a){ try{ localStorage.setItem(FAV_KEY,JSON.stringify(a)); }catch(e){} }
// Sync dos mercados favoritos com a conta (tabela favoritos no Supabase, RLS dono-só).
// Carrega no login (a conta é a fonte da verdade entre dispositivos); grava com debounce.
async function carregarFavoritos(){
  if(!sb||!SESSAO) return;
  try{ const {data}=await sb.from("favoritos").select("mercado_slug,ordem").eq("user_id",SESSAO.user.id).order("ordem",{ascending:true});
    if(data&&data.length) setFavMercados(data.map(r=>r.mercado_slug));
  }catch(e){}
}
let _favTimer=null;
function salvarFavoritos(){
  if(!sb||!SESSAO) return;                 // sem conta: fica só no localStorage
  clearTimeout(_favTimer);
  _favTimer=setTimeout(()=>{
    const uid=SESSAO.user.id, favs=favMercados();
    sb.from("favoritos").delete().eq("user_id",uid).then(({error})=>{
      if(!error&&favs.length){ sb.from("favoritos").insert(favs.map((s,i)=>({user_id:uid,mercado_slug:s,ordem:i}))).then(()=>{},()=>{}); }
    },()=>{});
  },600);
}
function ehFav(m){ const s=(m&&(m.slug||m.mercado_slug))||""; return s&&favMercados().includes(s); }
function seloFav(m){ return ehFav(m)?` <span class="fav-star" title="Seu mercado">${ic("star")}</span>`:""; }

/* embrulha o conteúdo real (borrado) com o cadeado + CTA de desbloquear */
function bloqueado(inner,titulo,sub){
  const virgem=!trialJaUsado();
  const cta=virgem?`Liberar grátis por ${TRIAL_DIAS} dias`:"Assine e desbloqueie";
  return `<div class="paywall">
    <div class="pw-blur">${inner||""}</div>
    <div class="pw-over">
      <div class="pw-lock">${ic("lock")}</div>
      <div class="pw-tit">${titulo}</div>
      ${sub?`<div class="pw-sub">${sub}</div>`:""}
      <button class="pw-cta" type="button" onclick="desbloquear()">${ic("crown")} ${cta}</button>
      ${virgem?`<div class="pw-fine">${TRIAL_DIAS} dias grátis · sem cartão · cancele quando quiser</div>`:`<div class="pw-fine">a partir de ${PRECO_MENSAL}/mês</div>`}
    </div>
  </div>`;
}

/* ---------------- tela de conta / assinatura / meus mercados ---------------- */
function loadPerfil(secao){
  catAtiva=null; marcarNav(); $("#btnCesta").setAttribute("aria-pressed","false"); $("#q").value="";
  const u=usuario(), prem=acessoPremium(), emTrial=trialAtivo(), assinante=plano()==="assinante";
  const status = assinante?"Assinante PouPou+":(emTrial?`Acesso grátis — ${diasRestantesTrial()} dia(s) restantes`:"Conta grátis");
  const hero=`<div class="pf-hero">
      <div class="row">
        <div class="who"><span class="pf-avatar">${ic("user")}</span>
          <div><div class="nm">${u?esc(u.nome):"Visitante"}</div><div class="sub">${u?esc(u.email)+" · ":""}${status}</div></div></div>
        <span class="plano-badge ${prem?"pro":"free"}">${assinante?ic("crown")+" PouPou+":(emTrial?"Trial":"Grátis")}</span>
      </div>
      ${u?`<button class="pf-sair" type="button" onclick="sair()">Sair da conta</button>`
         :`<button class="pf-sair entrar" type="button" onclick="abrirLogin(()=>loadPerfil())">Entrar / criar conta</button>`}
    </div>`;

  const benef=`<ul class="benef">
      <li><span class="ok">${ic("check")}</span> Ver <b>em qual mercado</b> pegar cada item da sua lista pra pagar menos</li>
      <li><span class="ok">${ic("check")}</span> A <b>rota otimizada</b>: o que comprar em cada mercado</li>
      <li><span class="ok">${ic("check")}</span> Ranking de <b>qual supermercado</b> sai mais barato pra sua feira inteira</li>
      <li><span class="ok">${ic("check")}</span> <b>Alertas</b> quando um item da sua feira baixa de preço</li>
      <li><span class="ok">${ic("check")}</span> Seus <b>mercados favoritos</b> em destaque na comparação</li>
    </ul>`;

  let assine;
  if(assinante){
    assine=`<div class="assine-card pro"><h3>${ic("crown")} Você é PouPou+</h3>
        <p class="sub2">Tudo liberado — economize à vontade. Obrigado por apoiar!</p>${benef}</div>`;
  } else {
    const chip = emTrial
      ? `<div class="trial-chip on">⏳ Seu acesso completo termina em <b>${diasRestantesTrial()} dia(s)</b></div>`
      : (trialJaUsado()? "" : `<div class="trial-chip">✨ Comece com <b>${TRIAL_DIAS} dias grátis</b> — sem cartão</div>`);
    const btn = trialJaUsado()? `Assinar por ${PRECO_MENSAL}/mês` : `Começar — ${TRIAL_DIAS} dias grátis`;
    assine=`<div class="assine-card">${chip}
        <h3>${ic("crown")} PouPou+</h3>
        <div class="preco"><span class="de-preco">${PRECO_DE}</span> ${PRECO_MENSAL}<small>/mês</small></div>
        <div class="preco-anual">ou <b>${PRECO_ANUAL}/ano</b> <span class="badge-off">melhor preço</span></div>
        ${benef}
        <div class="roi">${ic("check")} Uma feira otimizada economiza <b>mais que um mês</b> de PouPou+. Ele se paga na primeira compra.</div>
        <button class="btn-primary" type="button" onclick="assinarAgora()">${btn}</button>
        <p class="fine">Pagamento via Mercado Pago (Pix ou cartão). Cancele quando quiser.</p></div>`;
  }

  const estados=[["gratis","Grátis"],["trial","Em trial"],["assinante","Assinante"]];
  const modoTeste=`<div class="pf-sec"><h4>Modo teste</h4>
      <p class="hint">Simula os estados pra você ver o app em cada um (enquanto a cobrança real não entra).</p>
      <div class="seg">${estados.map(([v,l])=>`<button type="button" class="${plano()===v?"on":""}" onclick="testePlano('${v}')">${l}</button>`).join("")}</div></div>`;

  const meus=`<div class="pf-sec"><h4>Meus mercados</h4>
      <p class="hint">Marque os supermercados que você usa. Eles aparecem em destaque na comparação.</p>
      <div class="mkt-pick" id="mktPick">${renderMeusMercados()}</div></div>`;

  const cfg=`<div class="pf-sec"><h4>Preferências</h4>
      <label class="modo-teste"><span class="lbl">Tema escuro<small>conforto pra vista à noite</small></span>
        <span class="switch"><input type="checkbox" id="tgTema" ${document.documentElement.dataset.theme==="dark"?"checked":""} onchange="toggleTema()"><span class="track"></span><span class="knob"></span></span></label></div>`;

  ctx.textContent="";
  saida.innerHTML=hero+assine+modoTeste+meus+cfg;
  if(secao==="assinar"){ const c=saida.querySelector(".assine-card"); if(c) c.scrollIntoView({behavior:"smooth",block:"center"}); }
}
function testePlano(v){
  if(v==="trial"){ lsSet(TRIAL_INI_KEY,new Date().toISOString()); lsSet(TRIAL_USADO_KEY,"1"); }
  setPlano(v); loadPerfil();
}
function renderMeusMercados(){
  const favs=favMercados();
  const ordenados=[...MERCADOS].sort((a,b)=>{
    const ia=favs.indexOf(a.slug), ib=favs.indexOf(b.slug);
    if(ia>=0&&ib>=0) return ia-ib;
    if(ia>=0) return -1; if(ib>=0) return 1;
    return (a.nome||"").localeCompare(b.nome||"");
  });
  return ordenados.map(m=>{
    const i=favs.indexOf(m.slug), on=i>=0;
    const ord=on?`<span class="ord">${i+1}º</span>`:`<span class="ord"></span>`;
    const up=on&&i>0?`<button class="fav" type="button" title="Subir" onclick="moverFav('${m.slug}',-1)">${ic("chevron")}</button>`:"";
    return `<div class="mkt-row ${on?"on":""}">
      <span class="grip">${ic("grip")}</span>
      ${badgeMini(m)}<span class="nm">${esc(m.nome)}</span>
      ${on?ord:""}
      <button class="fav" type="button" aria-pressed="${on}" title="${on?"Remover dos favoritos":"Marcar como favorito"}" onclick="toggleFav('${m.slug}')">${ic("star")}</button>
    </div>`;
  }).join("");
}
function toggleFav(slug){
  const favs=favMercados(); const i=favs.indexOf(slug);
  if(i>=0) favs.splice(i,1); else favs.push(slug);
  setFavMercados(favs); salvarFavoritos(); const el=$("#mktPick"); if(el) el.innerHTML=renderMeusMercados();
}
function moverFav(slug,dir){
  const favs=favMercados(); const i=favs.indexOf(slug); if(i<0) return;
  const j=i+dir; if(j<0||j>=favs.length) return;
  [favs[i],favs[j]]=[favs[j],favs[i]]; setFavMercados(favs); salvarFavoritos();
  const el=$("#mktPick"); if(el) el.innerHTML=renderMeusMercados();
}

function marcarNav(){
  [...document.querySelectorAll("#cats .cat, #subcats .sub")].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.slug===catAtiva)));
}
function renderCats(){
  catsEl.innerHTML=categorias.filter(c=>c.disponivel)
    .map(c=>`<button class="cat" data-slug="${c.slug}" aria-pressed="false">${ic(CAT_ICON[c.slug]||"cat_outros","ci")}<span>${esc(c.nome)}</span></button>`).join("");
  catsEl.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>loadCategoria(b.dataset.slug,b.querySelector("span").textContent)));
}
function renderFrescos(lista){
  lista=lista||[];
  subEl.hidden=false;
  const oferta=`<button class="sub oferta" data-slug="fresco:ofertas" aria-pressed="false">${ic("cat_oferta")} Ofertas</button>`;
  const clube=`<button class="sub clube" data-slug="fresco:clube" aria-pressed="false">${ic("crown")} Clube</button>`;
  const basica=`<button class="sub basica" data-slug="fresco:basica" aria-pressed="false">${ic("cart")} Cesta básica</button>`;
  const cats=lista.map(c=>`<button class="sub" data-slug="fresco:${c.slug}" aria-pressed="false">${ic(FRESCO_ICON[c.slug]||"cat_outros")} ${esc(c.nome)}</button>`).join("");
  subEl.innerHTML=`<span class="lbl">Frescos e ofertas</span>${basica}${oferta}${clube}${cats}`;
  subEl.querySelectorAll(".sub").forEach(b=>{
    if(b.dataset.slug==="fresco:basica"){ b.addEventListener("click",loadCestaBasica); return; }
    if(b.dataset.slug==="fresco:ofertas"){ b.addEventListener("click",loadOfertas); return; }
    if(b.dataset.slug==="fresco:clube"){ b.addEventListener("click",loadClube); return; }
    const c=lista.find(x=>`fresco:${x.slug}`===b.dataset.slug);
    b.addEventListener("click",()=>loadFrescos(c.slug,c.nome)); });
}

let t=null;
$("#q").addEventListener("input",e=>{ clearTimeout(t); const q=e.target.value.trim(); $("#btnCesta").setAttribute("aria-pressed","false"); t=setTimeout(()=>loadBusca(q),260); });
$("#btnCesta").addEventListener("click",loadCesta);

(async function init(){
  setTemaBtn();
  // restaura a sessão salva (login persiste entre visitas) e carrega o perfil/plano da conta
  if(sb){
    try{ const {data}=await sb.auth.getSession(); SESSAO=data.session||null; if(SESSAO) await carregarPerfil(); }catch(e){}
    sb.auth.onAuthStateChange((_ev,sess)=>{ SESSAO=sess||null; atualizarContaUI(); });
  }
  atualizarContaUI();
  atualizarBadge();
  try{ const mk=await fetch(`${API}/mercados`).then(r=>r.json());
    MERCADOS=mk.mercados||[];
    MERCADOS.forEach(m=>{ if(m.logo_url){ MKT_LOGO[m.slug]=m.logo_url; MKT_LOGO[m.nome]=m.logo_url; } });
  }catch(e){}
  try{ const d=await fetch(`${API}/categorias`).then(r=>r.json());
    categorias=d.categorias; renderCats();
    const p=categorias.find(c=>c.disponivel); if(p) loadCategoria(p.slug,p.nome);
  }catch(e){ saida.innerHTML=`<p class="state">Não consegui carregar as categorias.</p>`; }
  try{ const f=await fetch(`${API}/frescos/categorias`).then(r=>r.json());
    renderFrescos(f.categorias);
  }catch(e){}
})();
</script>
