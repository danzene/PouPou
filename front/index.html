function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function usuario(){ return SESSAO?{email:SESSAO.user.email, nome:PERFIL.nome||(SESSAO.user.email||"").split("@")[0]}:null; }
function estaLogado(){ return !!SESSAO; }
function plano(){ return PERFIL.plano||"gratis"; }
function trialIni(){ return PERFIL.trial_ini?new Date(PERFIL.trial_ini):null; }
function diasRestantesTrial(){ const ini=trialIni(); if(!ini) return 0;
  return Math.max(0, Math.ceil((ini.getTime()+TRIAL_DIAS*864e5-Date.now())/864e5)); }
function trialAtivo(){ return plano()==="trial" && diasRestantesTrial()>0; }
// assinante agora EXPIRA: só é premium enquanto plano_expira_em > agora (o servidor é a
// fonte da verdade; isto mantém a UI do cliente alinhada e não mostra "PouPou+" vencido).
function assinanteAtivo(){
  if(plano()!=="assinante") return false;
  if(!PERFIL.plano_expira_em) return true;                 // compat: assinante legado sem data
  return new Date(PERFIL.plano_expira_em).getTime() > Date.now();
}
function acessoPremium(){ return assinanteAtivo() || trialAtivo(); }
function trialJaUsado(){ return !!PERFIL.trial_usado; }
function atualizarContaUI(){ const b=$("#btnConta"); if(b) b.classList.toggle("pro",acessoPremium()); }

// Perfil (plano/trial) na conta do Supabase. O cache atualiza na hora; o banco em seguida.
async function carregarPerfil(){
  if(!sb||!SESSAO){ PERFIL={plano:"gratis",trial_ini:null,trial_usado:false,nome:null,is_admin:false,plano_expira_em:null,mp_preapproval_id:null,mp_status:null}; return; }
  try{ const {data}=await sb.from("profiles").select("plano,trial_ini,trial_usado,nome,is_admin,plano_expira_em,mp_preapproval_id,mp_status").eq("id",SESSAO.user.id).maybeSingle();
    if(data) PERFIL={plano:data.plano||"gratis", trial_ini:data.trial_ini, trial_usado:!!data.trial_usado, nome:data.nome, is_admin:!!data.is_admin, plano_expira_em:data.plano_expira_em, mp_preapproval_id:data.mp_preapproval_id, mp_status:data.mp_status};
  }catch(e){}
  await carregarFavoritos();   // hidrata "meus mercados" da conta (sync entre dispositivos)
}
function ehAdmin(){ return !!(PERFIL && PERFIL.is_admin); }
// O PLANO É DO SERVIDOR: o cliente não escreve mais em profiles (a RLS bloqueia). O trial
// começa por um endpoint autenticado; o assinante só muda pelo webhook do pagamento.
async function iniciarTrial(){
  if(!sb||!SESSAO) return false;
  try{
    const r=await fetchAuth(`${API}/trial/iniciar`,{method:"POST"}).then(x=>x.json());
    await carregarPerfil();        // re-hidrata do servidor (fonte da verdade)
    atualizarContaUI();
    return !!(r&&r.ok);
  }catch(e){ return false; }
}

/* CLÍMAX: clique em "ver onde comprar". Sem conta -> login. Com conta e trial disponível ->
   começa o trial de 3 dias (server-side). Trial já usado/expirado -> tela de assinatura. */
async function desbloquear(){
  if(!estaLogado()){ abrirLogin(desbloquear); return; }
  if(acessoPremium()){ reabrir(); return; }
  if(!trialJaUsado()){
    const ok=await iniciarTrial();
    if(ok){ toast(`Acesso completo liberado por ${TRIAL_DIAS} dias 🎉`); reabrir(); return; }
  }
  loadPerfil("assinar");
}
/* re-renderiza a vista aberta (drawer/lista/listagem) já com os mercados liberados */
function reabrir(){
  if($("#drawerOv") && DRAWER && DRAWER.prod){ fecharProduto(); renderDrawer(DRAWER.prod); return; }
  if($("#btnCesta").getAttribute("aria-pressed")==="true"){ loadCesta(); return; }
  if(catAtiva && catAtiva.indexOf("fresco")!==0){ const c=categorias.find(x=>x.slug===catAtiva); if(c) loadCategoria(c.slug,c.nome); }
}
// Cobrança REAL: cria o pagamento no Mercado Pago e redireciona pro checkout (init_point).
//   metodo='cartao' -> assinatura recorrente (renova sozinho); 'pix' -> avulso (libera N dias).
async function assinarAgora(plano, metodo){
  if(!estaLogado()){ abrirLogin(()=>assinarAgora(plano,metodo)); return; }
  plano=(plano==="anual")?"anual":"mensal"; metodo=(metodo==="cartao")?"cartao":"pix";
  const btns=[...document.querySelectorAll(".btn-pay")]; btns.forEach(b=>b.disabled=true);
  const solta=()=>btns.forEach(b=>b.disabled=false);
  try{
    const r=await fetchAuth(`${API}/assinatura/criar`,{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({plano,metodo})});
    if(!r.ok){ toast(r.status===503?"Pagamento ainda não configurado":"Não foi possível iniciar o pagamento"); solta(); return; }
    const d=await r.json();
    if(d.init_point){ window.location.href=d.init_point; }   // vai pro checkout do Mercado Pago
    else{ toast("Não foi possível iniciar o pagamento"); solta(); }
  }catch(e){ toast("Erro ao iniciar o pagamento"); solta(); }
}
async function cancelarAssinatura(){
  if(!confirm("Cancelar a renovação automática? Seu acesso continua até o fim do período já pago.")) return;
  try{
    const r=await fetchAuth(`${API}/assinatura/cancelar`,{method:"POST"});
    if(r.ok){ toast("Renovação cancelada — acesso mantido até o vencimento."); await carregarPerfil(); loadPerfil(); }
    else{ const d=await r.json().catch(()=>({})); toast(d.detail||"Não foi possível cancelar"); }
  }catch(e){ toast("Erro ao cancelar"); }
}
// volta do checkout do Mercado Pago. A back_url NÃO é prova de pagamento — a verdade vem do
// webhook (que atualiza o profiles). Aqui a gente re-checa o perfil algumas vezes até liberar.
async function tratarRetornoPagamento(){
  const qp=new URLSearchParams(location.search);
  const pg=qp.get("pagamento");
  if(!pg) return;
  history.replaceState({}, "", location.pathname);   // limpa a query da URL
  if(pg==="sucesso"){
    let ok=acessoPremium();
    for(let i=0;i<5 && !ok;i++){ await new Promise(r=>setTimeout(r,2000)); await carregarPerfil(); ok=acessoPremium(); }
    toast(ok?"PouPou+ ativo ✓ 🎉":"Pagamento recebido — liberando em instantes…");
    atualizarContaUI();
  } else if(pg==="pendente"){
    toast("Pagamento pendente — o Pix pode levar alguns minutos.");
  } else {
    toast("Pagamento não concluído.");
  }
}

      <p class="auth-err" id="authErr" aria-live="polite"></p>
      <button class="auth-btn" type="submit">${criar?`Criar conta e liberar ${TRIAL_DIAS} dias`:"Entrar"}</button>

async function authSubmit(ev){ ev.preventDefault();
  const email=($("#aEmail").value||"").trim().toLowerCase(), senha=$("#aSenha").value||"";
  const nomeEl=$("#aNome"), nome=nomeEl?(nomeEl.value||"").trim():"";
  const err=$("#authErr"), btn=$("#loginBox .auth-btn"), criar=_authModo==="criar";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent="Digite um e-mail válido."; return false; }
  if(senha.length<6){ err.textContent="A senha precisa de ao menos 6 caracteres."; return false; }
  if(!sb){ err.textContent="Não conectei ao servidor. Recarregue a página."; return false; }
  err.textContent=""; if(btn){ btn.disabled=true; btn.dataset.txt=btn.textContent; btn.textContent="Aguarde…"; }
  const reset=()=>{ if(btn){ btn.disabled=false; btn.textContent=btn.dataset.txt||"Enviar"; } };
  try{
    let res=criar
      ? await sb.auth.signUp({email, password:senha, options:{data:{nome:nome||email.split("@")[0]}}})
      : await sb.auth.signInWithPassword({email, password:senha});
    if(res.error){ err.textContent=traduzErroAuth(res.error.message); reset(); return false; }
    if(criar && !res.data.session){   // cadastrou sem sessão -> entra na hora (a conta é auto-confirmada)
      const si=await sb.auth.signInWithPassword({email, password:senha});
      if(si.data && si.data.session){ res=si; }
      else { err.textContent="Conta criada! Confirme o link no seu e-mail e depois entre."; reset(); return false; }
    }
    SESSAO=res.data.session;
    await carregarPerfil();
    const cb=_authCb;                 // captura ANTES do fecharLogin (que zera _authCb)
    fecharLogin(); atualizarContaUI(); atualizarBadge();   // carrega a feira do usuário
    if(criar) abrirOnboarding(cb);    // conta nova -> personaliza (escolher mercados) antes de seguir
    else if(cb) cb();
  }catch(e){ err.textContent="Erro de conexão. Tente de novo."; reset(); }
  return false;
}
function traduzErroAuth(m){
  m=(m||"").toLowerCase();
  if(m.includes("invalid login")) return "E-mail ou senha errados.";
  if(m.includes("already registered")||m.includes("already been registered")||m.includes("user already")) return "Esse e-mail já tem conta. Toque em Entrar.";
  if(m.includes("email not confirmed")) return "Confirme seu e-mail antes de entrar (veja sua caixa de entrada).";
  if(m.includes("password")) return "Senha fraca — use 6+ caracteres.";
  if(m.includes("rate limit")||m.includes("too many")||m.includes("seconds")) return "Muitas tentativas. Espere um minutinho.";
  return "Não deu pra entrar agora. Tente de novo.";
}

/* ------- onboarding de personalização (aparece 1x, logo após CRIAR a conta) -------
   Deixa a pessoa escolher os mercados que usa; viram favoritos (destaque na comparação
   + sync na conta). Rápido e pulável — não é barreira antes de liberar o app. */
let _onbCb=null, _onbSel=null;
function abrirOnboarding(cb){
  const done=(typeof cb==="function")?cb:null;
  if(!MERCADOS.length){ if(done) done(); return; }   // sem mercados carregados: não trava o fluxo
  _onbCb=done; _onbSel=new Set(favMercados());
  renderOnboarding(); $("#onbModal").classList.add("show");
}
function renderOnboarding(){
  const u=usuario(); const nome=(u&&u.nome)?esc(u.nome.split(" ")[0]):"";
  const tiles=[...MERCADOS].map(m=>{
    const on=_onbSel.has(m.slug);
    return `<button type="button" class="onb-tile ${on?"on":""}" data-slug="${m.slug}" aria-pressed="${on}" onclick="onbToggle('${m.slug}')">
      <span class="onb-check">${ic("check")}</span>${badgeMini(m)}<span class="onb-nm">${esc(m.nome)}</span></button>`;
  }).join("");
  const n=_onbSel.size;
  $("#onbBox").innerHTML=`
    <div class="auth-brand"><h2>Pou<span class="p2">Pou</span></h2></div>
    <h3 class="onb-tit">${nome?`Boas-vindas, ${nome}! 🎉`:"Boas-vindas! 🎉"}</h3>
    <p class="onb-sub">Quais supermercados você usa? A gente destaca eles na comparação e mostra onde economizar.</p>
    <div class="onb-cep">
      <div class="onb-cep-row">
        <input id="onbCep" type="text" inputmode="numeric" maxlength="9" placeholder="Seu CEP (opcional)" oninput="onbCepMask(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();onbBuscarCep();}">
        <button type="button" class="onb-cep-btn" onclick="onbBuscarCep()">Achar meus mercados</button>
      </div>
      <div id="onbCepMsg" class="onb-cep-msg"></div>
    </div>
    <div class="onb-grid">${tiles}</div>
    <button class="auth-btn" type="button" onclick="onbConcluir()">${n?`Continuar com ${n} mercado${n>1?"s":""}`:"Escolha ao menos 1 (ou pule)"}</button>
    <button class="onb-skip" type="button" onclick="onbPular()">Pular por agora</button>`;
}
// atualiza seleção/botão SEM re-renderizar (preserva o campo de CEP e sua mensagem)
function onbSyncTiles(){
  document.querySelectorAll('#onbBox .onb-tile').forEach(t=>{
    const on=_onbSel.has(t.dataset.slug); t.classList.toggle('on',on); t.setAttribute('aria-pressed',on);
  });
  const n=_onbSel.size, btn=document.querySelector('#onbBox .auth-btn');
  if(btn) btn.textContent=n?`Continuar com ${n} mercado${n>1?"s":""}`:"Escolha ao menos 1 (ou pule)";
}
function onbToggle(slug){ if(_onbSel.has(slug)) _onbSel.delete(slug); else _onbSel.add(slug); onbSyncTiles(); }
function onbCepMask(el){ let v=el.value.replace(/\D/g,"").slice(0,8); if(v.length>5) v=v.slice(0,5)+"-"+v.slice(5); el.value=v; }
async function onbBuscarCep(){
  const el=$("#onbCep"), msg=$("#onbCepMsg"), cep=(el.value||"").replace(/\D/g,"");
  if(cep.length!==8){ msg.textContent="Digite os 8 números do CEP."; msg.className="onb-cep-msg err"; return; }
  msg.textContent="Buscando sua região…"; msg.className="onb-cep-msg";
  try{
    const d=await fetch(`${API}/cep/${cep}`).then(r=>r.json());
    if(!d.ok){ msg.textContent=d.erro||"Não achei esse CEP."; msg.className="onb-cep-msg err"; return; }
    const loc=`📍 ${d.bairro?d.bairro+", ":""}${d.cidade}-${d.uf}`;
    if(d.coberto&&d.mercados.length){
      _onbSel=new Set(d.mercados); onbSyncTiles();
      msg.textContent=`${loc} · marquei ${d.mercados.length} mercado${d.mercados.length>1?"s":""} da sua região ⭐ (ajuste se quiser)`;
      msg.className="onb-cep-msg ok";
    }else{
      msg.textContent=`${loc}. Por ora focamos na Região de Campinas — escolha os mercados na mão abaixo.`;
      msg.className="onb-cep-msg";
    }
  }catch(e){ msg.textContent="Erro ao buscar o CEP."; msg.className="onb-cep-msg err"; }
}
function onbConcluir(){
  const favs=[...MERCADOS].map(m=>m.slug).filter(s=>_onbSel.has(s));   // ordem estável = ordem da lista
  setFavMercados(favs); salvarFavoritos(); const n=favs.length;
  fecharOnboarding();
  if(n) toast(`${n} mercado${n>1?"s":""} marcado${n>1?"s":""} como seu${n>1?"s":""} ⭐`);
}
function onbPular(){ fecharOnboarding(); }
function fecharOnboarding(){ $("#onbModal").classList.remove("show"); const cb=_onbCb; _onbCb=null; if(typeof cb==="function") cb(); }

function toast(msg){ let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2800); }

function favMercados(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||"[]"); }catch(e){ return []; } }

// Carrega no login (a conta é a fonte da verdade entre dispositivos); grava com debounce.
async function carregarFavoritos(){
  if(!sb||!SESSAO) return;
  try{ const {data}=await sb.from("favoritos").select("mercado_slug,ordem").eq("user_id",SESSAO.user.id).order("ordem",{ascending:true});
    if(data&&data.length) setFavMercados(data.map(r=>r.mercado_slug));
  }catch(e){}

let _favTimer=null;
function salvarFavoritos(){
  if(!sb||!SESSAO) return;                 // sem conta: fica só no localStorage
  clearTimeout(_favTimer);
  _favTimer=setTimeout(()=>{
    const uid=SESSAO.user.id, favs=favMercados();
    sb.from("favoritos").delete().eq("user_id",uid).then(({error})=>{
      if(!error&&favs.length){ sb.from("favoritos").insert(favs.map((s,i)=>({user_id:uid,mercado_slug:s,ordem:i}))).then(()=>{},()=>{}); }
    },()=>{});
  },600);
}
function ehFav(m){ const s=(m&&(m.slug||m.mercado_slug))||""; return s&&favMercados().includes(s); }
function seloFav(m){ return ehFav(m)?` <span class="fav-star" title="Seu mercado">${ic("star")}</span>`:""; }

function renderMeusMercados(){
  const favs=favMercados();
  const ordenados=[...MERCADOS].sort((a,b)=>{
    const ia=favs.indexOf(a.slug), ib=favs.indexOf(b.slug);
    if(ia>=0&&ib>=0) return ia-ib;
    if(ia>=0) return -1; if(ib>=0) return 1;
    return (a.nome||"").localeCompare(b.nome||"");
  });
  return ordenados.map(m=>{
    const i=favs.indexOf(m.slug), on=i>=0;
    const ord=on?`<span class="ord">${i+1}º</span>`:`<span class="ord"></span>`;
    const up=on&&i>0?`<button class="fav" type="button" title="Subir" onclick="moverFav('${m.slug}',-1)">${ic("chevron")}</button>`:"";
    return `<div class="mkt-row ${on?"on":""}">
      <span class="grip">${ic("grip")}</span>
      ${badgeMini(m)}<span class="nm">${esc(m.nome)}</span>
      ${on?ord:""}

    </div>`;
  }).join("");
}
function toggleFav(slug){
  const favs=favMercados(); const i=favs.indexOf(slug);
  if(i>=0) favs.splice(i,1); else favs.push(slug);
  setFavMercados(favs); salvarFavoritos(); const el=$("#mktPick"); if(el) el.innerHTML=renderMeusMercados();
}
function moverFav(slug,dir){
  const favs=favMercados(); const i=favs.indexOf(slug); if(i<0) return;
  const j=i+dir; if(j<0||j>=favs.length) return;
  [favs[i],favs[j]]=[favs[j],favs[i]]; setFavMercados(favs); salvarFavoritos();
  const el=$("#mktPick"); if(el) el.innerHTML=renderMeusMercados();
}

    if(b.dataset.slug==="fresco:basica"){ b.addEventListener("click",loadCestaBasica); return; }
    if(b.dataset.slug==="fresco:ofertas"){ b.addEventListener("click",loadOfertas); return; }
    if(b.dataset.slug==="fresco:clube"){ b.addEventListener("click",loadClube); return; }
    const c=lista.find(x=>`fresco:${x.slug}`===b.dataset.slug);
    b.addEventListener("click",()=>loadFrescos(c.slug,c.nome)); });
}

let t=null;
$("#q").addEventListener("input",e=>{ clearTimeout(t); const q=e.target.value.trim(); $("#btnCesta").setAttribute("aria-pressed","false"); t=setTimeout(()=>loadBusca(q),260); });
$("#btnCesta").addEventListener("click",loadCesta);

(async function init(){
  setTemaBtn();
  // restaura a sessão salva (login persiste entre visitas) e carrega o perfil/plano da conta
  if(sb){
    try{ const {data}=await sb.auth.getSession(); SESSAO=data.session||null; if(SESSAO) await carregarPerfil(); }catch(e){}
    sb.auth.onAuthStateChange((_ev,sess)=>{ SESSAO=sess||null; atualizarContaUI(); });
  }
  await tratarRetornoPagamento();   // se voltou do checkout do Mercado Pago
  atualizarContaUI();
  atualizarBadge();
  try{ const mk=await fetch(`${API}/mercados`).then(r=>r.json());
    MERCADOS=mk.mercados||[];
    MERCADOS.forEach(m=>{ if(m.logo_url){ MKT_LOGO[m.slug]=m.logo_url; MKT_LOGO[m.nome]=m.logo_url; } });
  }catch(e){}
  try{ const d=await fetch(`${API}/categorias`).then(r=>r.json());
    categorias=d.categorias; renderCats();
    const p=categorias.find(c=>c.disponivel); if(p) loadCategoria(p.slug,p.nome);
  }catch(e){ saida.innerHTML=`<p class="state">Não consegui carregar as categorias.</p>`; }
  try{ const f=await fetch(`${API}/frescos/categorias`).then(r=>r.json());
    renderFrescos(f.categorias);
  }catch(e){}
})();
</script>
