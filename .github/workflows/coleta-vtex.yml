name: Coleta VTEX completa (nuvem)

# Crawl COMPLETO dos VTEX (Savegnago, Covabra, Atacadao, Oba) - descobre produtos novos.
# E o crawl pesado, 1x/dia. Depois: poda do historico + conferidor (auto-cura).
# Era a tarefa MercadoBarato-Rapidos do PC.

on:
  # horario: quem dispara e o pg_cron do Supabase (supabase/agendador.sql) -
  # o 'schedule' do GitHub atrasava horas ou pulava execucoes.
  workflow_dispatch: {}

concurrency:
  group: coleta-vtex       # mesmo grupo do refresh: nunca bate nos mesmos sites em paralelo
  cancel-in-progress: false

jobs:
  coleta:
    uses: ./.github/workflows/_coleta.yml
    secrets: inherit
    with:
      timeout: 330
      comandos: |
        python coletar.py savegnago covabra atacadao oba
        python manutencao.py || echo "::warning::manutencao falhou (segue)"
        python conferir_precos.py --corrigir || echo "::warning::conferidor achou divergencias (ver log)"
