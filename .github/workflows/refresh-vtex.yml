name: Refresh rapido VTEX (nuvem)

# Refresh LEVE dos VTEX: reconsulta em lote (~40 EANs/requisicao) os produtos ja conhecidos.
# Poucos minutos, baixo risco de bloqueio -> a cada 3h. Era a MercadoBarato-RefreshRapido.
# O Pague Menos (Convertiez) NAO entra aqui: tem robo proprio (paguemenos-nuvem.yml).

on:
  # horario: quem dispara e o pg_cron do Supabase (supabase/agendador.sql) -
  # o 'schedule' do GitHub atrasava horas ou pulava execucoes.
  workflow_dispatch: {}

concurrency:
  group: coleta-vtex
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/_coleta.yml
    secrets: inherit
    with:
      timeout: 90
      comandos: python refrescar.py savegnago covabra atacadao oba
