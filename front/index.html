<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<script>(function(){try{var t=localStorage.getItem("mb-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>PouPou — Compare, escolha e economize nas compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#f5f8f5; --surface:#ffffff; --surface-2:#eef4ef; --line:#e5ebe6; --line-2:#d6ded8;
    --ink:#10201a; --mut:#5f7168; --faint:#93a29a;
    --green:#0fa968; --green-press:#0b8f57; --green-dark:#0a7247; --green-light:#e7f5ed; --on-green:#ffffff;
    --yellow:#c78a1e; --yellow-soft:#fbf0d9;
    --red:#d64b3f; --red-soft:#fbeae8;
    --focus:#1f6bff;
    --r-card:16px; --r-btn:11px; --r-input:12px; --r-pill:999px;
    --sh-sm:0 1px 2px rgba(16,32,26,.04);
    --sh:0 1px 2px rgba(16,32,26,.04), 0 8px 24px -12px rgba(16,32,26,.10);
    --sh-hover:0 2px 4px rgba(16,32,26,.05), 0 16px 40px -16px rgba(16,32,26,.18);
    --wrap:1120px;
    --disp:"Bricolage Grotesque",-apple-system,"Segoe UI",sans-serif;
    --body:"Hanken Grotesk",-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0d1411; --surface:#141c18; --surface-2:#1d2721; --line:#28332c; --line-2:#38443c;
    --ink:#e9f1ec; --mut:#93a49b; --faint:#68776f;
    --green:#39c78b; --green-press:#2fb87e; --green-dark:#66d9a4; --green-light:#122c20; --on-green:#04140d;
    --yellow:#e6b45c; --yellow-soft:#2c2410;
    --red:#ff7c6d; --red-soft:#3a221f;
    --focus:#5b9dff;
    --sh-sm:0 1px 2px rgba(0,0,0,.4);
    --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
    --sh-hover:0 2px 6px rgba(0,0,0,.5), 0 18px 46px -16px rgba(0,0,0,.7);
  }
  *{ box-sizing:border-box; }
  html{ background:var(--bg); }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
    font-feature-settings:"ss01"; }
  b,strong{ font-weight:600; }
  a{ color:var(--focus); text-decoration:none; }
  .num{ font-variant-numeric:tabular-nums; }
  .ico{ display:inline-flex; vertical-align:-.15em; }
  .ico svg{ width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); border:0; }
  .skip{ position:absolute; left:-999px; top:0; background:var(--surface); padding:10px 14px; border-radius:var(--r-btn); z-index:30; }
  .skip:focus{ left:12px; top:12px; outline:3px solid var(--focus); }
  :focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

  /* ---------- header ---------- */
  header{ position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter:saturate(1.4) blur(12px); }
  .head-in{ max-width:var(--wrap); margin:0 auto; padding:14px 20px; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand .logo{ width:38px; height:38px; flex:0 0 auto; display:grid; place-items:center; }
  .brand .logo svg{ width:38px; height:38px; display:block; }
  .brand h1{ margin:0; font-family:var(--disp); font-size:23px; font-weight:800; letter-spacing:-.03em; color:var(--ink); }
  .brand h1 .p2{ color:var(--green); }
  .brand .loc{ margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:500; color:var(--mut);
    background:var(--surface-2); padding:5px 11px; border-radius:var(--r-pill); }
  .tagline{ color:var(--mut); font-size:13.5px; margin:8px 0 14px 49px; max-width:640px; }
  @media(max-width:560px){ .tagline{ margin:8px 0 14px; } }
  .searchrow{ display:flex; gap:10px; }
  .search{ position:relative; flex:1; }
  .search .mag{ position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:18px; }
  .search input{ width:100%; height:48px; padding:0 16px 0 44px; font-size:15px; font-weight:500; color:var(--ink);
    border:1px solid var(--line); border-radius:var(--r-btn); background:var(--bg); }
  .search input::placeholder{ color:var(--faint); font-weight:400; }
  .search input:focus-visible{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-light); background:var(--surface); }
  .cesta-btn{ height:48px; padding:0 18px; font-size:14.5px; font-weight:600; cursor:pointer; white-space:nowrap;
    border:none; border-radius:var(--r-btn); background:var(--green); color:var(--on-green); display:inline-flex; align-items:center;
    gap:8px; position:relative; }
  .cesta-btn:hover{ background:var(--green-press); }
  .cesta-btn .pill{ background:rgba(255,255,255,.24); border-radius:var(--r-pill); min-width:22px; height:22px;
    padding:0 6px; display:inline-grid; place-items:center; font-size:12.5px; font-weight:600; }
  .cesta-btn .dot{ position:absolute; top:-3px; right:-3px; width:12px; height:12px; border-radius:50%;
    background:var(--yellow); border:2px solid var(--surface); }
  .cesta-btn .dot[hidden]{ display:none; }

  /* ---------- category nav (abas de texto limpas) ---------- */
  nav.cats{ max-width:var(--wrap); margin:0 auto; padding:2px 20px 0; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none;
    border-bottom:1px solid var(--line); }
  nav.cats::-webkit-scrollbar{ display:none; }
  .cat{ flex:0 0 auto; display:inline-flex; align-items:center; cursor:pointer;
    border:none; background:none; color:var(--mut); font:600 14px var(--body); padding:13px 12px 12px;
    border-bottom:2px solid transparent; white-space:nowrap; margin-bottom:-1px; }
  .cat .ci{ display:none; }
  .cat:hover{ color:var(--ink); }
  .cat[aria-pressed="true"]{ color:var(--green-dark); border-bottom-color:var(--green); }
  .subcats{ max-width:var(--wrap); margin:0 auto; padding:14px 20px 0; display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; align-items:center; }
  .subcats::-webkit-scrollbar{ display:none; }
  .subcats .lbl{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); white-space:nowrap; margin-right:5px; }
  .sub{ flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--mut); font-size:13px; font-weight:600;
    cursor:pointer; padding:7px 14px; border-radius:var(--r-pill); display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:.15s; }
  .sub:hover{ border-color:var(--line-2); color:var(--ink); }
  .sub[aria-pressed="true"]{ background:var(--green); border-color:var(--green); color:var(--on-green); }
  .sub.oferta{ color:var(--yellow); border-color:color-mix(in srgb,var(--yellow) 40%, var(--line)); }
  .sub.oferta[aria-pressed="true"]{ background:var(--yellow); border-color:var(--yellow); color:#3a2a00; }

  /* ---------- main ---------- */
  main{ max-width:var(--wrap); margin:0 auto; padding:26px 20px 72px; }
  .ctx{ color:var(--mut); font-size:14px; font-weight:500; margin:0 2px 18px; }
  .state{ text-align:center; color:var(--mut); padding:64px 16px; font-size:16px; }
  .state .big{ display:block; font-size:32px; color:var(--faint); margin-bottom:12px; }
  .sec-title{ font-family:var(--disp); font-size:19px; font-weight:700; letter-spacing:-.01em; color:var(--ink); margin:28px 2px 14px; display:flex; align-items:center; gap:9px; }
  .sec-title .muted{ font-family:var(--body); font-weight:500; color:var(--mut); font-size:13px; letter-spacing:0; }

  /* ---------- product grid / card ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px; align-items:stretch; }
  @media(max-width:760px){ .grid{ grid-template-columns:1fr; gap:12px; } }
  .prod{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--sh);
    display:flex; flex-direction:column; transition:box-shadow .18s, transform .18s, border-color .18s; }
  .prod:hover{ box-shadow:var(--sh-hover); transform:translateY(-2px); border-color:var(--line-2); }
  .prod-top{ display:flex; gap:14px; padding:20px 20px 0; flex:1 1 auto; }
  .thumb{ width:60px; height:60px; border-radius:12px; object-fit:contain; background:var(--surface-2); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; padding:4px; }
  .thumb[data-no-image]{ color:var(--faint); font-size:26px; }
  .thumb[data-no-image]::before{ content:"\1F6D2"; }
  .prod-info{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .prod-nome{ font-size:15px; font-weight:600; line-height:1.32; color:var(--ink); margin:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .prod-meta{ font-size:12.5px; color:var(--faint); font-weight:500; margin-top:4px; }
  .prod-price{ margin-top:16px; }
  .lbl-menor{ font-size:10.5px; font-weight:700; letter-spacing:.09em; color:var(--green-dark); text-transform:uppercase; }
  .prod-preco{ font-family:var(--disp); font-size:32px; font-weight:700; color:var(--ink); line-height:1.02; letter-spacing:-.02em; margin-top:3px; }
  .prod-preco .uni{ font-size:.5em; font-weight:600; color:var(--mut); }
  .prod-mkt{ display:flex; align-items:center; gap:9px; margin-top:11px; font-size:14.5px; font-weight:600; color:var(--ink); }
  .prod-mkt.oculto{ color:var(--mut); font-weight:500; }
  .prod-n{ font-size:12.5px; color:var(--faint); margin-top:4px; }
  .prod-foot{ display:flex; gap:10px; padding:16px 20px 20px; margin-top:16px; }
  .btn-compare{ flex:1; height:44px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
    font-size:14px; font-weight:600; border-radius:var(--r-btn); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.15s; }
  .btn-compare:hover{ background:var(--green-light); border-color:var(--green); color:var(--green-dark); }
  .btn-compare .chev{ transition:transform .15s; color:var(--faint); }
  .btn-compare:hover .chev{ color:var(--green); }
  .btn-compare[aria-expanded="true"] .chev{ transform:rotate(180deg); }
  .btn-add{ width:44px; height:44px; flex:0 0 auto; border:1px solid var(--line-2); background:var(--surface); color:var(--green-dark);
    border-radius:var(--r-btn); cursor:pointer; font-size:20px; display:grid; place-items:center; transition:.15s; }
  .btn-add:hover{ border-color:var(--green); background:var(--green-light); }
  .btn-add.in{ background:var(--green); border-color:var(--green); color:var(--on-green); }

  /* ---------- ranking de preços (comparação) ---------- */
  .rank{ list-style:none; margin:0; padding:6px 16px 14px; border-top:1px solid var(--line); }
  .rank-row{ display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid var(--line); }
  .rank-row:last-child{ border-bottom:none; }
  .rank-pos{ width:22px; text-align:center; font-size:13px; font-weight:600; color:var(--faint); flex:0 0 auto; }
  .rank-row.best .rank-pos{ color:var(--green); }
  .badge{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:600;
    flex:0 0 auto; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .badge-logo{ background:#fff; overflow:hidden; }
  .badge-logo img{ width:100%; height:100%; object-fit:contain; padding:2px; }
  .rank-info{ flex:1; min-width:0; border:none; background:none; cursor:pointer; text-align:left; padding:4px 4px; border-radius:8px;
    display:flex; flex-direction:column; gap:2px; align-items:flex-start; }
  .rank-info:hover{ background:var(--surface-2); }
  .rank-nome{ font-size:14px; font-weight:500; color:var(--ink); display:inline-flex; align-items:center; gap:6px; }
  .rank-fresc{ font-size:9px; } .fresc-ok{ color:var(--green); } .fresc-mid{ color:var(--yellow); } .fresc-old{ color:var(--red); }
  .rank-hist{ font-size:11px; color:var(--focus); }
  .rank-info[aria-expanded="true"] .rank-hist::after{ content:" \25B2"; }
  .rank-tags{ display:flex; gap:5px; flex-wrap:wrap; }
  .rank-price{ text-align:right; flex:0 0 auto; }
  .rank-price .v{ font-size:15.5px; font-weight:600; color:var(--mut); }
  .rank-row.best .rank-price .v{ color:var(--green-dark); font-weight:700; }
  .rank-price .de{ display:block; font-size:11px; color:var(--faint); text-decoration:line-through; }
  .rank-menor{ font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--green-dark); }
  .ver-site{ flex:0 0 auto; width:30px; height:30px; display:grid; place-items:center; color:var(--focus);
    border:1px solid var(--line); border-radius:8px; font-size:15px; }
  .ver-site:hover{ border-color:var(--focus); }

  /* tags de promoção */
  .tag-off{ font-size:11px; font-weight:600; color:var(--red); background:var(--red-soft); border-radius:var(--r-pill); padding:2px 8px; }
  .tag-site{ font-size:11px; font-weight:600; color:var(--green-dark); background:var(--green-light); border-radius:var(--r-pill); padding:2px 8px; }
  /* fidelidade = preço que exige cartão/app do mercado (não é pra todos) */
  .tag-fid{ font-size:11px; font-weight:700; color:#7a4e00; background:#ffe7ad; border:1px solid #f0c66a; border-radius:var(--r-pill); padding:2px 8px; }
  .tag-open{ font-size:11px; font-weight:600; color:var(--green-dark); background:var(--green-light); border-radius:var(--r-pill); padding:2px 8px; }

  /* ---------- histórico ao tocar ---------- */
  .hist-panel{ animation:fade .18s ease; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .hist-inner{ background:var(--surface-2); border-radius:12px; padding:14px; margin:4px 0 6px; }
  .hist-top{ font-size:13.5px; font-weight:500; color:var(--ink); margin-bottom:10px; line-height:1.4; }
  .hist-resumo{ font-size:13px; color:var(--mut); margin-bottom:10px; }
  .hist-resumo b{ color:var(--ink); }
  .hist-lista{ display:flex; flex-wrap:wrap; gap:6px; }
  .h-row{ display:flex; align-items:center; gap:5px; font-size:13px; font-weight:500;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-pill); padding:4px 10px; }
  .h-data{ color:var(--mut); }
  .h-up{ color:var(--red); } .h-down{ color:var(--green); } .h-flat{ color:var(--faint); }
  .hist-vazio{ font-size:13px; color:var(--mut); line-height:1.5; }

  /* ---------- economia (cesta) ---------- */
  .eco{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--sh);
    padding:26px 24px; text-align:center; margin-bottom:16px; }
  .eco-lbl{ font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); }
  .eco-num{ font-size:46px; font-weight:700; color:var(--green); line-height:1.05; letter-spacing:-.02em; margin:8px 0 6px; }
  .eco-pct{ display:inline-block; vertical-align:middle; margin-left:12px; font-size:16px; font-weight:700;
    color:#fff; background:var(--green); padding:5px 13px; border-radius:999px; letter-spacing:0; }
  .eco-sub{ font-size:14.5px; color:var(--mut); margin:0 auto; max-width:420px; }
  .eco-det{ margin-top:16px; }
  .eco-det>summary{ list-style:none; cursor:pointer; font-size:13px; color:var(--focus); display:inline-flex; align-items:center; gap:5px; }
  .eco-det>summary::-webkit-details-marker{ display:none; }
  .eco-fonte{ font-size:13px; color:var(--mut); line-height:1.55; margin:12px auto; max-width:520px; text-align:left; }
  .eco-lista{ list-style:none; margin:12px 0 0; padding:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; text-align:left; }
  .eco-lista li{ display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:11px 14px; border-bottom:1px solid var(--line); align-items:center; }
  .eco-lista li:last-child{ border-bottom:none; }
  .eco-lista li:nth-child(even){ background:var(--surface-2); }
  .eco-lista li b{ grid-row:1/span 2; grid-column:2; color:var(--green-dark); font-weight:700; white-space:nowrap; }
  .ed-nome{ font-size:13.5px; font-weight:500; } .ed-q{ color:var(--mut); font-weight:600; }
  .ed-txt{ font-size:12.5px; color:var(--mut); }

  /* comparação 1 loja vs otimizada */
  .vs{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:stretch; margin-bottom:14px; }
  @media(max-width:560px){ .vs{ grid-template-columns:1fr; } .vs .vs-mid{ transform:rotate(90deg); } }
  .vs-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:18px; }
  .vs-card.best{ border-color:var(--green); background:var(--green-light); }
  .vs-tag{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
  .vs-card.best .vs-tag{ color:var(--green-dark); }
  .vs-mkt{ display:flex; align-items:center; gap:7px; margin-top:8px; font-size:14px; color:var(--ink); }
  .vs-val{ font-size:28px; font-weight:700; color:var(--ink); letter-spacing:-.02em; margin-top:6px; }
  .vs-sub{ font-size:13px; color:var(--mut); margin-top:4px; }
  .vs-mid{ align-self:center; color:var(--faint); font-size:13px; font-weight:500; padding:0 4px; }
  .btn-primary{ width:100%; height:50px; border:none; border-radius:var(--r-btn); background:var(--green); color:var(--on-green);
    font-size:15px; font-weight:600; cursor:pointer; box-shadow:var(--sh-sm); display:inline-flex; align-items:center; justify-content:center; gap:8px; margin-bottom:6px; }
  .btn-primary:hover{ background:var(--green-dark); }

  /* compra otimizada — grupos por mercado */
  .grp{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:14px 16px; margin-bottom:10px; }
  .grp-h{ display:flex; align-items:center; gap:9px; }
  .grp-h .nm{ font-size:14.5px; font-weight:600; color:var(--ink); }
  .grp-h .n{ font-size:12.5px; color:var(--mut); }
  .grp-h .sub{ margin-left:auto; font-weight:700; color:var(--green-dark); }
  .grp-i{ display:flex; justify-content:space-between; gap:10px; font-size:13.5px; color:var(--ink); padding:6px 0 6px 33px; border-top:1px solid var(--line); margin-top:8px; }
  .grp-i:first-of-type{ border-top:none; }
  .grp-i .p{ color:var(--mut); white-space:nowrap; }

  /* ranking de mercados */
  .mrank{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; margin-bottom:10px; }
  .mrank-row{ display:flex; align-items:center; gap:11px; padding:13px 16px; border-bottom:1px solid var(--line); }
  .mrank-row:last-child{ border-bottom:none; }
  .mrank-medal{ font-size:19px; width:26px; text-align:center; flex:0 0 auto; }
  .mrank-info{ flex:1; min-width:0; }
  .mrank-nm{ font-size:14.5px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .mrank-sub{ font-size:12.5px; color:var(--mut); margin-top:2px; }
  .mrank-falta{ color:var(--red); }
  .mrank-val{ text-align:right; flex:0 0 auto; }
  .mrank-val .t{ font-size:15px; font-weight:700; color:var(--ink); }
  .mrank-val .t.muted{ color:var(--mut); font-weight:600; }
  .mrank-val .d{ font-size:12px; color:var(--red); margin-top:1px; }
  .mrank-val .d.ok{ color:var(--green-dark); font-weight:600; }
  .mrank-val .d.muted{ color:var(--faint); }
  .mrank-cover{ font-size:11.5px; font-weight:600; color:var(--mut); background:var(--surface-2); border-radius:var(--r-pill); padding:1px 8px; }
  .mrank-cover.full{ color:var(--green-dark); background:var(--green-light); }
  .mrank-row.parcial{ background:var(--surface-2); }
  .mrank-nota{ font-size:13px; color:var(--mut); line-height:1.5; margin:0 2px 10px; }
  .mrank-nota .tred{ color:var(--red); }

  /* ---------- lista de compras (cesta) ---------- */
  .li-progress{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--mut); margin:2px 2px 12px; }

    display:flex; align-items:center; gap:12px; }
  .li.done{ opacity:.6; } .li.done .li-nome{ text-decoration:line-through; }
  .chk{ width:22px; height:22px; accent-color:var(--green); cursor:pointer; flex:0 0 auto; }
  .li .thumb{ width:52px; height:52px; }
  .li-body{ flex:1; min-width:0; }
  .li-nome{ font-size:14.5px; font-weight:600; color:var(--ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .li-menor{ font-size:13px; color:var(--mut); margin-top:2px; }

  .li-alert{ font-size:12.5px; color:var(--mut); margin-top:5px; display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .li-alert.on{ color:var(--green-dark); }
  .li-alert.on b{ color:var(--green-dark); }
  .queda{ color:var(--green-dark); font-weight:600; }
  .alvo-in{ width:88px; height:34px; padding:0 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface);
    color:var(--ink); font-size:13px; }
  .alvo-in:focus-visible{ border-color:var(--green); outline:none; box-shadow:0 0 0 3px var(--green-light); }
  .li-act{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .stepper{ display:flex; align-items:center; gap:4px; }
  .stepper button{ width:34px; height:34px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:8px; font-size:18px; cursor:pointer; line-height:1; }
  .stepper button:hover{ background:var(--surface-2); }
  .qin{ width:44px; height:34px; text-align:center; font-weight:600; font-size:14px; border:1px solid var(--line);
    border-radius:8px; background:var(--surface); color:var(--ink); -moz-appearance:textfield; }

    border-radius:8px; cursor:pointer; font-size:15px; }

  .alerta-banner{ background:var(--yellow-soft); border:1px solid #f0dca6; color:#7a5a12; border-radius:var(--r-btn);
    padding:12px 16px; margin-bottom:14px; font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px; }

  /* ---------- frescos / ofertas cards ---------- */

    padding:14px 16px; margin-bottom:12px; display:flex; align-items:center; gap:14px; }
  .per-main{ flex:1; min-width:0; }

  .per-hist-btn{ margin-top:8px; display:inline-flex; align-items:center; gap:5px; font:inherit; font-size:12px; font-weight:600; color:var(--mut); background:none; border:none; padding:2px 0; cursor:pointer; transition:color .12s; }
  .per-hist-btn:hover{ color:var(--green-dark); }
  .per-hist-btn svg{ flex:none; opacity:.9; }
  .per-loja{ display:flex; align-items:center; gap:8px; font-size:13.5px; }

  .per-raw{ font-size:11.5px; color:var(--faint); } .per-raw::before{ content:"·"; margin:0 4px; }

  .li-tag{ font-size:10.5px; font-weight:700; color:var(--green-dark); background:var(--green-light); border-radius:var(--r-pill); padding:1px 7px; margin-left:4px; white-space:nowrap; }

  .per-de{ font-size:12px; color:var(--faint); text-decoration:line-through; }

  .promo-tags{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }

  /* ---------- cesta fixa no mobile ---------- */

    .cesta-fixa .info{ flex:1; min-width:0; }
    .cesta-fixa .lbl{ font-size:11px; color:var(--mut); }
    .cesta-fixa .val{ font-size:16px; font-weight:700; color:var(--green-dark); }
    .cesta-fixa[hidden]{ display:none; }
  }

  /* ---------- botão de tema ---------- */
  .tema-btn{ width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
    color:var(--mut); cursor:pointer; display:grid; place-items:center; font-size:19px; flex:0 0 auto; margin-left:12px; }
  .tema-btn:hover{ color:var(--ink); border-color:var(--line-2); }

  /* ---------- drawer de produto ---------- */
  .drawer-ov{ position:fixed; inset:0; z-index:50; background:rgba(15,21,18,.5); display:flex; justify-content:flex-end;
    opacity:0; animation:ovIn .18s ease forwards; }
  @keyframes ovIn{ to{ opacity:1 } }
  .drawer{ width:min(480px,100%); background:var(--bg); height:100%; display:flex; flex-direction:column;
    box-shadow:-8px 0 40px rgba(0,0,0,.2); transform:translateX(12px); animation:drIn .22s ease forwards; }
  @keyframes drIn{ to{ transform:translateX(0) } }
  @media(max-width:520px){ .drawer-ov{ align-items:flex-end; justify-content:center; } .drawer{ width:100%; height:94%; border-radius:18px 18px 0 0; transform:translateY(16px); animation:drUp .22s ease forwards; } @keyframes drUp{ to{ transform:translateY(0) } } }
  .drawer-top{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--surface); }
  .drawer-top .eyebrow{ font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }
  .drawer-x{ margin-left:auto; width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--surface);
    color:var(--mut); cursor:pointer; font-size:20px; display:grid; place-items:center; }
  .drawer-x:hover{ color:var(--ink); }
  .drawer-scroll{ flex:1; overflow-y:auto; padding:20px 18px 28px; }
  .dp-nome{ font-size:19px; font-weight:600; line-height:1.3; margin:0 0 16px; color:var(--ink); }
  .dp-price-lbl{ font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--green-dark); }
  .dp-preco{ font-size:38px; font-weight:700; color:var(--ink); line-height:1.02; letter-spacing:-.02em; margin:3px 0 4px; }
  .dp-mkt{ display:flex; align-items:center; gap:8px; font-size:14.5px; color:var(--ink); }
  .dp-var{ display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; margin-top:12px; }
  .dp-var.down{ color:var(--green); } .dp-var.up{ color:var(--red); } .dp-var.flat{ color:var(--mut); }
  /* veredito "está barato?" */
  .verdict{ display:flex; align-items:center; gap:12px; margin:16px 0 4px; padding:14px 16px; border-radius:var(--r-card); border:1px solid var(--line); }
  .verdict .vdot{ width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .verdict.bom{ background:var(--green-light); border-color:transparent; } .verdict.bom .vdot{ background:var(--green); }
  .verdict.normal{ background:var(--yellow-soft); border-color:transparent; } .verdict.normal .vdot{ background:var(--yellow); }
  .verdict.alto{ background:var(--red-soft); border-color:transparent; } .verdict.alto .vdot{ background:var(--red); }
  .verdict .vt{ font-size:14px; font-weight:600; color:var(--ink); }
  .verdict .vs{ font-size:12.5px; color:var(--mut); margin-top:1px; }
  /* histórico */
  .dp-sec{ font-size:14px; font-weight:600; color:var(--ink); margin:24px 0 10px; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tab{ border:1px solid var(--line); background:var(--surface); color:var(--mut); font-size:12.5px; font-weight:500;
    cursor:pointer; padding:6px 12px; border-radius:var(--r-pill); white-space:nowrap; }
  .tab:hover{ color:var(--ink); border-color:var(--line-2); }
  .tab.on{ background:var(--ink); border-color:var(--ink); color:var(--surface); }
  .tabs.mkts .tab.on{ background:var(--green); border-color:var(--green); color:var(--on-green); }
  .chart-wrap{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:14px 12px 8px; }
  .chart-wrap svg{ display:block; width:100%; height:130px; overflow:visible; }
  .chart-dot{ cursor:pointer; }
  .chart-tip{ position:absolute; transform:translate(-50%,-114%); background:var(--ink); color:var(--surface);
    border-radius:8px; padding:7px 10px; font-size:12px; line-height:1.35; white-space:nowrap; pointer-events:none;
    box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:2; }
  .chart-tip .d{ opacity:.75; font-size:11px; } .chart-tip .p{ font-weight:600; }
  .chart-tip[hidden]{ display:none; }
  .chart-vazio{ color:var(--mut); font-size:13px; text-align:center; padding:30px 10px; }
  .resumo{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .resumo .r{ flex:1; min-width:130px; background:var(--surface-2); border-radius:10px; padding:9px 12px; }
  .resumo .r .l{ font-size:11.5px; color:var(--mut); } .resumo .r .v{ font-size:15px; font-weight:600; color:var(--ink); margin-top:1px; }
  .resumo .r .v.down{ color:var(--green); } .resumo .r .v.up{ color:var(--red); }
  /* legenda do gráfico "Todos os mercados" */
  .chart-legenda{ display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:12px; }
  .chart-legenda .leg{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--mut); }
  .chart-legenda .leg-dot{ width:10px; height:10px; border-radius:3px; flex:0 0 auto; }
  /* comparação de mercados no drawer */
  .cmp{ list-style:none; margin:0; padding:0; border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; }
  .cmp li{ display:flex; align-items:center; gap:11px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .cmp li:last-child{ border-bottom:none; }

  .cmp .nm{ flex:1; min-width:0; font-size:14px; color:var(--ink); }
  .cmp .best-lbl{ font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--green-dark); }
  .cmp .pr{ font-size:15px; font-weight:600; color:var(--mut); }

  .ver-txt{ flex:0 0 auto; display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:600; color:var(--focus); text-decoration:none; white-space:nowrap; }
  .ver-txt:hover{ text-decoration:underline; }
  .ver-txt svg{ width:13px; height:13px; }
  .ver-txt.off{ color:var(--faint); font-weight:500; }
  .drawer-foot{ padding:14px 18px; border-top:1px solid var(--line); background:var(--surface); }
  /* pontos-chave do histórico (hoje / 7d / 30d) */
  .dp-pontos{ display:flex; gap:8px; margin-top:10px; }
  .dp-pontos .pt{ flex:1; background:var(--surface-2); border-radius:10px; padding:9px 10px; text-align:center; }
  .dp-pontos .pt .l{ display:block; font-size:11px; color:var(--mut); }
  .dp-pontos .pt .v{ display:block; font-size:15px; font-weight:600; color:var(--ink); margin-top:2px; }
  /* alerta de preço (abre ao tocar) */
  .li-alert-wrap{ margin-top:6px; }
  .li-alert-btn{ border:1px solid var(--line); background:var(--surface); color:var(--mut); font-size:12.5px; cursor:pointer;
    border-radius:var(--r-pill); padding:5px 11px; display:inline-flex; align-items:center; gap:6px; }
  .li-alert-btn:hover{ border-color:var(--line-2); color:var(--ink); }
  .li-alert-btn.on{ color:var(--green-dark); border-color:var(--green-light); background:var(--green-light); }
  .li-alert-btn b{ color:var(--ink); } .li-alert-btn.on b{ color:var(--green-dark); }
  .li-alert-edit{ margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--mut); }
  .btn-sm{ height:34px; padding:0 14px; border:none; border-radius:8px; background:var(--green); color:var(--on-green);
    font-size:13px; font-weight:600; cursor:pointer; }
  .btn-sm:hover{ background:var(--green-dark); }

  /* ============ MOBILE FIRST (≤767px) ============ */
  @media(max-width:767px){
    html,body{ overflow-x:hidden; }
    .head-in{ padding:14px 16px 10px; }
    .brand{ gap:10px; }
    .brand h1{ font-size:20px; }
    .brand .loc{ font-size:13px; }
    .brand .loc .full{ display:none; }             /* mostra só "Campinas" */
    .tema-btn{ width:36px; height:36px; margin-left:8px; }
    .tagline{ margin:8px 0 12px; font-size:13.5px; }
    .searchrow{ flex-direction:column; gap:10px; }  /* busca e "Minha lista" empilhados */
    .search input{ height:50px; }
    .cesta-btn{ width:100%; height:48px; justify-content:center; }
    nav.cats{ padding:12px 16px 4px; gap:18px; }
    .subcats{ padding:8px 16px 0; }
    main{ padding:18px 16px calc(88px + env(safe-area-inset-bottom)); }  /* respiro p/ o footer fixo */
    .grid{ grid-template-columns:1fr; gap:14px; }
    .prod-top{ padding:16px; gap:14px; }
    .thumb{ width:68px; height:68px; }
    .prod-nome{ font-size:16px; line-height:1.25; }
    .prod-preco{ font-size:29px; }
    .prod-mkt{ font-size:14px; } .prod-n{ font-size:13px; }
    .btn-compare{ height:46px; font-size:14.5px; }
    .sec-title{ font-size:15px; }
    /* item da lista — composição empilhada (não tudo numa linha) */
    .li{ display:grid; grid-template-columns:auto 52px 1fr; grid-template-areas:"chk img body" "act act act"; gap:8px 12px; padding:14px; align-items:start; }
    .li>.chk{ grid-area:chk; align-self:center; width:24px; height:24px; }
    .li>.thumb{ grid-area:img; align-self:center; }
    .li-body{ grid-area:body; min-width:0; }
    .li-nome{ font-size:15px; }
    .li-menor{ font-size:13.5px; margin-top:3px; }
    .li-act{ grid-area:act; justify-content:space-between; margin-top:6px; padding-top:10px; border-top:1px solid var(--line); }
    .stepper button{ width:40px; height:40px; } .qin{ height:40px; width:48px; }
    .li-rm{ width:40px; height:40px; }
    /* comparação / economia respiram */
    .eco{ padding:22px 18px; } .eco-num{ font-size:40px; }
    .vs{ grid-template-columns:1fr; }
    .vs-mid{ transform:none; text-align:center; padding:2px; }
    .mrank-row{ padding:12px 14px; }
    /* footer fixo com safe-area */
    .cesta-fixa{ padding:10px 16px calc(10px + env(safe-area-inset-bottom)); min-height:64px; }
    /* drawer vira folha inferior confortável */
    .drawer-scroll{ padding:18px 16px 24px; }
    .dp-preco{ font-size:34px; }
    .tabs{ gap:6px; overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none; padding-bottom:2px; }
    .tabs::-webkit-scrollbar{ display:none; }
  }
  @media(min-width:520px) and (max-width:767px){ .drawer{ width:min(440px,100%); height:96%; } }

  /* ============ conta / assinatura / paywall (experiência do usuário) ============ */
  .acct-btn{ width:40px; height:40px; border-radius:var(--r-btn); border:1px solid var(--line); background:var(--surface);
    color:var(--mut); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; position:relative; }
  .acct-btn:hover{ color:var(--ink); border-color:var(--line-2); }
  .acct-btn .ico svg{ width:20px; height:20px; }
  .acct-btn .plano-dot{ position:absolute; top:-4px; right:-4px; width:16px; height:16px; border-radius:var(--r-pill);
    background:var(--yellow); border:2px solid var(--surface); display:none; align-items:center; justify-content:center; }
  .acct-btn.pro .plano-dot{ display:inline-flex; }

  /* selo de plano */

  .plano-badge.free{ background:var(--surface-2); color:var(--mut); }

  :root[data-theme="dark"] .plano-badge.pro{ color:var(--yellow); }

  /* paywall: conteúdo real borrado + cadeado por cima */

  .pw-blur{ filter:blur(6px) saturate(.8); opacity:.55; pointer-events:none; user-select:none; max-height:340px; overflow:hidden;
    -webkit-mask-image:linear-gradient(#000 55%,transparent); mask-image:linear-gradient(#000 55%,transparent); }
  .pw-over{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:8px; padding:22px; background:linear-gradient(180deg,transparent, color-mix(in srgb,var(--surface) 78%, transparent)); }
  .pw-lock{ width:46px; height:46px; border-radius:var(--r-pill); background:var(--yellow-soft); border:1px solid var(--yellow);
    display:flex; align-items:center; justify-content:center; }
  .pw-lock svg{ width:22px; height:22px; color:#7a4e00; }
  :root[data-theme="dark"] .pw-lock svg{ color:var(--yellow); }
  .pw-tit{ font-size:16px; font-weight:800; color:var(--ink); max-width:30ch; line-height:1.25; }
  .pw-sub{ font-size:13px; color:var(--mut); max-width:40ch; line-height:1.4; }
  .pw-cta{ margin-top:6px; height:44px; padding:0 22px; border:none; border-radius:var(--r-btn); cursor:pointer;
    background:var(--green); color:var(--on-green); font-weight:700; font-size:14.5px; display:inline-flex; align-items:center; gap:8px; }
  .pw-cta:hover{ background:var(--green-dark); }
  .pw-inline{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:#7a4e00;
    background:var(--yellow-soft); border:1px solid var(--yellow); border-radius:var(--r-pill); padding:3px 10px; }
  :root[data-theme="dark"] .pw-inline{ color:var(--yellow); }

  /* tela de perfil / assinatura */
  .pf-hero{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:20px; margin-bottom:16px; }
  .pf-hero .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .pf-hero .who{ display:flex; align-items:center; gap:12px; }

function ic(name,cls){ return `<span class="ico ${cls||""}" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS[name]||""}</svg></span>`; }
const CAT_ICON={mercearia:"cat_mercearia",bebidas:"cat_bebidas",limpeza:"cat_limpeza",higiene:"cat_higiene",laticinios:"cat_laticinios"};
const FRESCO_ICON={ofertas:"cat_oferta",carnes:"cat_carnes",bandeja:"cat_carnes",hortifruti:"cat_hortifruti",peixes:"cat_peixes",frios:"cat_frios",outros:"cat_outros"};

/* ---------- helpers (formatação / util) ---------- */
const brl=v=> v==null? "—" : "R$ "+Number(v).toFixed(2).replace(".",",");
const ppuFmt=(v,rot)=> v==null? "" : "R$ "+Number(v).toFixed(2).replace(".",",")+" "+(rot||"");
const dataCurta=iso=>{ const d=new Date(iso); return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}); };
function relTempo(iso){ if(!iso) return "—";
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<3600) return "há "+Math.max(1,Math.round(s/60))+" min";
  if(s<86400) return "há "+Math.round(s/3600)+"h";
  const d=Math.round(s/86400); return "há "+d+(d===1?" dia":" dias");
}
function classeFrescor(iso){ if(!iso) return "fresc-old";
  const h=(Date.now()-new Date(iso).getTime())/3600000;
  return h<12?"fresc-ok":h<36?"fresc-mid":"fresc-old"; }
function embalagem(q,u){ if(q==null||!u) return "";
  if(u==="kg") return q<1? Math.round(q*1000)+" g" : (""+q).replace(".",",")+" kg";
  if(u==="l")  return q<1? Math.round(q*1000)+" ml" : (""+q).replace(".",",")+" L";
  return (q%1?q.toFixed(0):q)+" un"; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hrefSeguro(url){ const u=String(url??"").trim(); return /^https?:\/\//i.test(u)?u:null; }
function iniciais(n){ const p=n.trim().split(/\s+/); return ((p[0]?.[0]||"")+(p[1]?.[0]||p[0]?.[1]||"")).toUpperCase(); }
function corTexto(hex){ if(!hex) return "#fff"; const h=hex.replace("#","");
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b)/255>0.6? "#17211c":"#fff"; }
function thumb(url,alt){ const u=hrefSeguro(url); return u
  ? `<img class="thumb" src="${esc(u)}" alt="" loading="lazy" onerror="this.dataset.noImage='true'">`
  : `<span class="thumb" data-no-image="true" aria-hidden="true"></span>`; }
let MKT_LOGO={}; // slug/nome -> URL da logo (carregado de /mercados no init)
function badgeMini(m){ const c=m.cor_badge||"#8a8a8a";
  const logo=(m.mercado_slug&&MKT_LOGO[m.mercado_slug])||(m.slug&&MKT_LOGO[m.slug])||MKT_LOGO[m.nome];
  if(logo) return `<span class="badge badge-logo" title="${esc(m.nome||"")}" aria-hidden="true"><img src="${esc(logo)}" alt="" loading="lazy"></span>`;
  return `<span class="badge" style="width:22px;height:22px;font-size:10px;background:${c};color:${corTexto(c)}" aria-hidden="true">${esc(iniciais(m.nome))}</span>`; }
function verLink(url,mkt){ const u=hrefSeguro(url); return u?`<a class="ver-site" href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="Ver no site do ${esc(mkt)} (abre em nova aba)">${ic("external")}</a>`:""; }
function verLinkTxt(url,mkt){ const u=hrefSeguro(url); return u?`<a class="ver-txt" href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="Ver no site do ${esc(mkt)} (abre em nova aba)">ver no site ${ic("external")}</a>`:`<span class="ver-txt off">sem link</span>`; }
// Selo do PROGRAMA exigido: quando o preço só vale com clube/fidelidade/cartão, o
// oferta_tipo guarda o NOME do programa (ex.: "Viva", "Fidelidade") e vira um selo.
// "oferta" (ou vazio) = preço pra todos -> SEM selo (a ausência já diz "não precisa de cartão").
function seloOferta(x){
  const t=x.oferta_tipo;
  if(!t || t==="oferta") return "";
  return `<span class="tag-fid" title="Esse preço só vale com o ${esc(t)} do mercado — não é o preço pra todo mundo">🪪 ${esc(t)}</span>`;
}
function badgesPromo(x){
  const b=[];
  if(x.desconto_pct) b.push(`<span class="tag-off">${x.desconto_pct}% OFF${x.preco_de?` · de ${brl(x.preco_de)}`:""}</span>`);
  const sel=seloOferta(x); if(sel) b.push(sel);
  if(x.so_no_site) b.push(`<span class="tag-site">só no site</span>`);
  return b.length?`<div class="promo-tags">${b.join("")}</div>`:"";
}

/* ---------- histórico de preço (tocar no mercado) ---------- */
let HIST_CACHE={};
function histChartSVG(pts){
  const w=280,h=60,pad=6,mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1,st=(w-2*pad)/(pts.length-1);
  const xy=pts.map((p,i)=>[pad+i*st,h-pad-((p-mn)/rg)*(h-2*pad)]);
  const line=xy.map(c=>`${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(" ");
  const area=`${pad},${h-pad} ${line} ${(w-pad).toFixed(1)},${h-pad}`;
  const last=xy[xy.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Evolução do preço">
    <polygon fill="var(--green-light)" points="${area}"/>
    <polyline fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round" points="${line}"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--green)"/></svg>`;
}
function histHTML(s,mercado){
  if(!s||!s.pontos||s.pontos.length<2)
    return `<div class="hist-vazio">Ainda não temos preços de dias anteriores no <b>${esc(mercado)}</b>. O histórico vai aparecendo conforme o app coleta, dia após dia.</div>`;
  const pts=s.pontos.slice(-30), precos=pts.map(p=>p.preco);
  const mn=Math.min(...precos), mx=Math.max(...precos), cur=precos[precos.length-1], ini=precos[0];
  const dif=cur-ini, seta=dif<0?`<span class="h-down">↓ caiu ${brl(Math.abs(dif))}</span>`:dif>0?`<span class="h-up">↑ subiu ${brl(dif)}</span>`:`<span class="h-flat">→ estável</span>`;
  const recent=pts.slice(-8).reverse();
  const linhas=recent.map((p,i,arr)=>{ const prev=arr[i+1];
    const a=prev?(p.preco<prev.preco?`<span class="h-down">↓</span>`:p.preco>prev.preco?`<span class="h-up">↑</span>`:`<span class="h-flat">→</span>`):"";
    return `<div class="h-row num"><span class="h-data">${dataCurta(p.coletado_em)}</span><span>${brl(p.preco)}</span>${a}</div>`; }).join("");
  return `<div class="hist-inner">
    <div class="hist-top">${ic("chart")} Preço nos últimos ${pts.length} dias no <b>${esc(mercado)}</b> — ${seta} desde ${dataCurta(pts[0].coletado_em)}</div>
    <div style="margin-bottom:10px">${histChartSVG(precos)}</div>
    <div class="hist-resumo num">menor <b>${brl(mn)}</b> · maior <b>${brl(mx)}</b> · agora <b>${brl(cur)}</b></div>
    <div class="hist-lista">${linhas}</div>
  </div>`;
}
async function toggleHistorico(ean,mercado,btn){
  const row=btn.closest(".rank-row")||btn.closest(".mrow")||btn.closest(".row"), aberto=row.nextElementSibling;
  if(aberto&&aberto.classList.contains("hist-panel")){ aberto.remove(); btn.setAttribute("aria-expanded","false"); return; }
  btn.setAttribute("aria-expanded","true");
  const panel=document.createElement("li"); panel.className="hist-panel"; panel.style.listStyle="none";
  panel.innerHTML=`<div class="hist-inner"><div class="hist-top">Carregando histórico…</div></div>`;
  row.after(panel);
  try{ let d=HIST_CACHE[ean];
    if(!d){ d=await fetch(`${API}/historico/${encodeURIComponent(ean)}`).then(r=>r.json()); HIST_CACHE[ean]=d; }
    const s=(d.series||[]).find(x=>x.mercado===mercado);
    panel.innerHTML=histHTML(s,mercado);
  }catch(e){ panel.innerHTML=`<div class="hist-inner"><div class="hist-vazio">Não consegui carregar o histórico agora.</div></div>`; }
}

/* ---------- tema claro / escuro ---------- */
function setTemaBtn(){ const dark=document.documentElement.dataset.theme==="dark";
  const b=$("#btnTema"); if(b) b.innerHTML=ic(dark?"sun":"moon"); }
function toggleTema(){ const dark=document.documentElement.dataset.theme==="dark";
  const novo=dark?"light":"dark"; document.documentElement.dataset.theme=novo;
  try{ localStorage.setItem("mb-theme",novo); }catch(e){} setTemaBtn(); }

/* ---------- drawer de produto (detalhe + histórico) ---------- */
let DRAWER={ean:null,hist:null,periodo:30,mercado:null,cheap:null};
const PERIODOS=[{d:7,l:"7 dias"},{d:14,l:"14 dias"},{d:30,l:"30 dias"},{d:90,l:"3 meses"}];
function _serie(m){ return (DRAWER.hist?.series||[]).find(s=>s.mercado===m)?.pontos||[]; }
function _janela(pts,dias){ const lim=Date.now()-dias*86400000; return pts.filter(p=>new Date(p.coletado_em).getTime()>=lim); }
function _variacao(pts,dias){ const f=_janela(pts,dias); if(f.length<2) return null;
  const a=f[0].preco, b=f[f.length-1].preco, abs=b-a; return {abs,pct:a?abs/a*100:0,dir:abs<-0.001?"down":abs>0.001?"up":"flat"}; }
function _veredito(pts){ const f=_janela(pts,30); if(f.length<4) return null;
  const cur=f[f.length-1].preco, avg=f.reduce((s,p)=>s+p.preco,0)/f.length, pct=avg?(cur-avg)/avg*100:0;
  if(pct<=-5) return {c:"bom",t:"Preço bom",s:`${Math.abs(pct).toFixed(1).replace(".",",")}% abaixo da média dos últimos 30 dias`};
  if(pct>=5)  return {c:"alto",t:"Preço alto",s:`${pct.toFixed(1).replace(".",",")}% acima da média dos últimos 30 dias`};
  return {c:"normal",t:"Preço normal",s:"próximo da média dos últimos 30 dias"}; }
function _pontoEm(pts,dias){ if(!pts.length) return null; const alvo=Date.now()-dias*86400000;
  let best=null,bd=Infinity; pts.forEach(p=>{ const d=Math.abs(new Date(p.coletado_em).getTime()-alvo); if(d<bd){bd=d;best=p;} }); return best; }
function _pontosChave(){
  const pts=_serie(DRAWER.mercado); if(pts.length<2) return "";
  const hoje=pts[pts.length-1], p7=_pontoEm(pts,7), p30=_pontoEm(pts,30);
  const linha=(l,p)=> p?`<div class="pt"><span class="l">${l}</span><span class="v num">${brl(p.preco)}</span></div>`:"";
  return `<div class="dp-pontos">${linha("Hoje",hoje)}${(p7&&p7!==hoje)?linha("7 dias atrás",p7):""}${(p30&&p30!==hoje&&p30!==p7)?linha("30 dias atrás",p30):""}</div>`;
}
// escapa string p/ dentro de um JS string em atributo onclick (aspas/barras)
function jsesc(s){ return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;"); }

// drawer de item FRESCO: MESMA cara do drawer de produto (preço + mercado + gráfico
// + lista "Comparar mercados" + rodapé "Adicionar à lista"). Frescos hoje são livres
// (sem paywall) — os preços atuais vêm do FRESCO_REG; o histórico do /historico-fresco.
async function abrirFresco(chave, nome){
  const g=FRESCO_REG[chave]||{precos:[],nome,modo:"kg"};
  try{
    const hist=await fetch(`${API}/historico-fresco/${encodeURIComponent(chave)}`).then(r=>r.json());
    const histMkts=(hist.series||[]).filter(s=>s.pontos&&s.pontos.length).map(s=>s.mercado);
    const cheapMkt=(g.precos&&g.precos[0])?g.precos[0].mercado:null;   // mercado mais barato hoje
    const primary=(cheapMkt&&histMkts.includes(cheapMkt))?cheapMkt:(histMkts[0]||cheapMkt);
    DRAWER={ean:null, hist, periodo:30, mercado:primary, cheap:primary, prod:null, fresco:{chave,nome,g,modo:g.modo||"kg"}};
    renderDrawerFresco();
  }catch(e){ /* ignora */ }
}
function renderDrawerFresco(){
  const f=DRAWER.fresco||{}, g=f.g||{precos:[]}, nome=f.nome||"", bandeja=f.modo==="bandeja";
  const rk=g.precos||[], best=rk[0];
  const uG=uniRot(g.rotulo,g.unidade);
  const naLista=g.chave&&CESTA_EANS.has("f:"+g.chave);
  const cheapPts=_serie(DRAWER.cheap);
  const v=_variacao(cheapPts,7);
  const varHTML=v?`<div class="dp-var ${v.dir}">${v.dir==="down"?"↓":v.dir==="up"?"↑":"→"} ${v.dir==="flat"?"estável":brl(Math.abs(v.abs))} nos últimos 7 dias</div>`:"";
  const ver=_veredito(cheapPts);

function drSetPeriodo(d){ DRAWER.periodo=d; document.querySelectorAll("#drPer .tab").forEach((b,i)=>b.classList.toggle("on",PERIODOS[i].d===d)); drRenderChart(); }
function drSetMercado(m){ DRAWER.mercado=m; document.querySelectorAll("#drMkts .tab").forEach(b=>b.classList.toggle("on",b.dataset.m===m)); drRenderChart(); }
function drRenderChart(){
  const host=$("#drChart"); if(!host) return;
  if(DRAWER.mercado==="__todos__"){ drRenderTodos(host); return; }   // comparar todos os mercados de uma vez
  const pts=_janela(_serie(DRAWER.mercado),DRAWER.periodo);
  if(pts.length<2){ host.innerHTML=`<div class="chart-wrap"><div class="chart-vazio">Ainda não há preços suficientes de <b>${esc(DRAWER.mercado||"")}</b> nesse período.<br>O histórico cresce conforme o app coleta a cada dia.</div></div>`; return; }
  const precos=pts.map(p=>p.preco), mn=Math.min(...precos), mx=Math.max(...precos), rg=(mx-mn)||1;
  const W=1000,H=130,pad=10,st=(W-2*pad)/(pts.length-1);
  const xy=pts.map((p,i)=>[pad+i*st, H-pad-((p.preco-mn)/rg)*(H-2*pad)]);
  const line=xy.map(c=>`${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(" ");
  const area=`${pad},${H-pad} ${line} ${(W-pad).toFixed(1)},${H-pad}`;
  const dots=xy.map((c,i)=>`<circle class="chart-dot" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="9" fill="transparent" data-i="${i}"/><circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="var(--green)" pointer-events="none"/>`).join("");
  const v=_variacao(pts,DRAWER.periodo);
  const vtxt=v?`<span class="v ${v.dir}">${v.dir==="down"?"↓":v.dir==="up"?"↑":"→"} ${v.dir==="flat"?"estável":brl(Math.abs(v.abs))+" ("+(v.pct<0?"":"+")+v.pct.toFixed(1).replace(".",",")+"%)"}</span>`:"—";
  host.innerHTML=`<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Gráfico de preço">
      <polygon fill="var(--green-light)" points="${area}"/>
      <polyline fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${line}" vector-effect="non-scaling-stroke"/>
      ${dots}
    </svg>
    <div class="chart-tip" id="drTip" hidden></div>
  </div>
  ${_pontosChave()}
  <div class="resumo">
    <div class="r"><div class="l">variação no período</div><div class="v ${v?v.dir:""}">${vtxt}</div></div>
    <div class="r"><div class="l">menor no período</div><div class="v num">${brl(mn)}</div></div>
    <div class="r"><div class="l">maior no período</div><div class="v num">${brl(mx)}</div></div>
  </div>`;
  const svg=host.querySelector("svg"), tip=$("#drTip"), wrap=host.querySelector(".chart-wrap");
  svg.querySelectorAll(".chart-dot").forEach(dot=>{
    const show=()=>{ const i=+dot.dataset.i, p=pts[i], rect=wrap.getBoundingClientRect();
      const cx=dot.getBoundingClientRect().left-rect.left+ (dot.getBoundingClientRect().width/2);
      const cy=dot.getBoundingClientRect().top-rect.top;
      tip.innerHTML=`<div class="d">${dataCurta(p.coletado_em)}</div><div>${esc(DRAWER.mercado)}</div><div class="p num">${brl(p.preco)}</div>`;
      tip.style.left=cx+"px"; tip.style.top=cy+"px"; tip.hidden=false; };
    dot.addEventListener("mouseenter",show); dot.addEventListener("click",show);
    dot.addEventListener("mouseleave",()=>{ tip.hidden=true; });
  });
}
// modo "Todos": sobrepõe a linha de cada mercado (cor da marca), eixo X por tempo pra alinhar as datas.
function drRenderTodos(host){
  const series=(DRAWER.hist?.series||[]).map(s=>({mercado:s.mercado, cor:s.cor_badge||"#8a8a8a",
      pts:_janela(s.pontos||[],DRAWER.periodo).slice().sort((a,b)=>new Date(a.coletado_em)-new Date(b.coletado_em))}))
    .filter(s=>s.pts.length>=2);
  if(!series.length){ host.innerHTML=`<div class="chart-wrap"><div class="chart-vazio">Ainda não há histórico suficiente pra comparar os mercados nesse período.<br>O histórico cresce conforme a coleta.</div></div>`; return; }
  const allp=[], allt=[];
  series.forEach(s=>s.pts.forEach(p=>{ allp.push(p.preco); allt.push(new Date(p.coletado_em).getTime()); }));
  const mn=Math.min(...allp), mx=Math.max(...allp), rg=(mx-mn)||1;
  const t0=Math.min(...allt), t1=Math.max(...allt), tr=(t1-t0)||1;
  const W=1000,H=150,pad=12;
  const X=t=>pad+((t-t0)/tr)*(W-2*pad), Y=p=>H-pad-((p-mn)/rg)*(H-2*pad);
  let polys="", dots="";
  series.forEach(s=>{
    const d=s.pts.map(p=>`${X(new Date(p.coletado_em).getTime()).toFixed(1)},${Y(p.preco).toFixed(1)}`).join(" ");
    polys+=`<polyline fill="none" stroke="${s.cor}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${d}" vector-effect="non-scaling-stroke"/>`;
    s.pts.forEach(p=>{ const x=X(new Date(p.coletado_em).getTime()), y=Y(p.preco);
      dots+=`<circle class="chart-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="transparent" data-m="${esc(s.mercado)}" data-p="${p.preco}" data-d="${esc(p.coletado_em)}" data-c="${s.cor}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="${s.cor}" pointer-events="none"/>`; });
  });
  const legenda=series.map(s=>`<span class="leg"><span class="leg-dot" style="background:${s.cor}"></span>${esc(s.mercado)}</span>`).join("");
  host.innerHTML=`<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Comparação de preços entre mercados">${polys}${dots}</svg>
    <div class="chart-tip" id="drTip" hidden></div>
  </div>
  <div class="chart-legenda">${legenda}</div>
  <div class="resumo">
    <div class="r"><div class="l">mercados</div><div class="v num">${series.length}</div></div>
    <div class="r"><div class="l">menor no período</div><div class="v num">${brl(mn)}</div></div>
    <div class="r"><div class="l">maior no período</div><div class="v num">${brl(mx)}</div></div>
  </div>`;
  const svg=host.querySelector("svg"), tip=$("#drTip"), wrap=host.querySelector(".chart-wrap");
  svg.querySelectorAll(".chart-dot").forEach(dot=>{
    const show=()=>{ const rect=wrap.getBoundingClientRect(), r=dot.getBoundingClientRect();
      tip.innerHTML=`<div class="d">${dataCurta(dot.dataset.d)}</div><div style="color:${dot.dataset.c};font-weight:600">${esc(dot.dataset.m)}</div><div class="p num">${brl(+dot.dataset.p)}</div>`;
      tip.style.left=(r.left-rect.left+r.width/2)+"px"; tip.style.top=(r.top-rect.top)+"px"; tip.hidden=false; };
    dot.addEventListener("mouseenter",show); dot.addEventListener("click",show);
    dot.addEventListener("mouseleave",()=>{ tip.hidden=true; });
  });
}

function blocoPereciveis(per){
  return `<div class="sec-title">${ic("cat_carnes")} Frescos e por peso <span class="muted">preço casado por nome</span></div>
    <p class="per-nota">Carnes, hortifrúti e padaria não têm código de barras universal — o preço é casado pelo nome e pode variar conforme peso ou corte.</p>
    <div class="grid">${per.map(g=>cardPerecivel(g)).join("")}</div>`;
}
function uniRot(rot,uni){ // "R$/kg" -> " /kg" ; fallback pra unidade do item
  if(rot) return " "+rot.replace(/R\$/,"").trim();
  return uni?` /${esc(uni)}`:"";
}
function idadeMkt(ce){ // idade do preço DAQUELE mercado (não do grupo) — cor por frescor
  return ce?`<span class="per-idade ${classeFrescor(ce)}" title="preço coletado ${relTempo(ce)}">${relTempo(ce)}</span>`:"";
}
// frescos usam o MESMO card compacto dos industrializados (.prod): thumb + menor preço
// + mercado + "Comparar preços e histórico" -> gaveta idêntica. Registra o grupo em
// FRESCO_REG pra a gaveta ler os preços atuais (o /historico-fresco só traz a série).
function cardPerecivel(g,ord,modo){
  if(g.chave) FRESCO_REG[g.chave]=Object.assign({},g,{modo});
  const bandeja=modo==="bandeja";
  const rk=g.precos||[], best=rk[0];
  const uG=uniRot(g.rotulo,g.unidade);
  const naLista=g.chave&&CESTA_EANS.has("f:"+g.chave);
  const add=`<button class="btn-add ${naLista?"in":""}" type="button" aria-label="Adicionar ${esc(g.nome)} à lista" title="Adicionar à lista" data-chave="${esc(g.chave)}" data-nome="${esc(g.nome)}" onclick="addFrescoBtn(this)">${naLista?"✓":"+"}</button>`;
  const precoMain=bandeja?brl(g.menor_pacote):`${brl(g.menor_preco)}${uG}`;
  const meta=bandeja?"bandeja · pacote":(g.unidade?`vendido por ${esc(g.unidade)}`:"por peso");
  const price=`<div class="prod-price">
      <span class="lbl-menor">${bandeja?"bandeja a partir de":"menor preço"}</span>
      <div class="prod-preco num">${precoMain}</div>
      ${best?`<div class="prod-mkt">${badgeMini({nome:best.mercado,cor_badge:best.cor_badge})} ${esc(best.mercado)}</div>`:""}
      <div class="prod-n">${rk.length} mercado${rk.length!==1?"s":""} comparado${rk.length!==1?"s":""}${bandeja?` · ${brl(g.menor_preco)}${uG}`:""}</div>
    </div>`;
  const compare=rk.length
    ? `<button class="btn-compare" type="button" onclick="abrirFresco('${jsesc(g.chave)}','${jsesc(g.nome)}')">Comparar preços e histórico ${ic("chevron")}</button>`
    : `<span class="prod-n" style="align-self:center">sem preço recente</span>`;
  return `<article class="prod">
    <div class="prod-top">${thumb(g.imagem_url,g.nome)}
      <div class="prod-info"><h3 class="prod-nome">${esc(g.nome)}</h3>
        ${meta?`<div class="prod-meta">${meta}</div>`:""}${price}</div></div>
    <div class="prod-foot">${compare}${add}</div>
  </article>`;
}
function cardOferta(o){
  const uni=o.unidade?`<span class="per-uni"> /${esc(o.unidade)}</span>`:"";
  const de=o.preco_de?`<div class="per-de num">${brl(o.preco_de)}</div>`:"";
  return `<div class="per-card">${thumb(o.imagem_url,o.nome)}
    <div class="per-main"><div class="prod-nome">${esc(o.nome)}</div>
      <div class="per-loja">${badgeMini({nome:o.mercado,cor_badge:o.cor_badge})}<span class="nm">${esc(o.mercado)}</span>${verLink(o.url,o.mercado)}</div>
      ${badgesPromo(o)}</div>
    <div class="per-right">${de}<div class="per-preco num">${brl(o.preco)}${uni}</div></div>
  </div>`;
}

/* ---------- Clube / Fidelidade: ofertas que exigem o programa do mercado ---------- */
let CLUBE_STATE={mercados:[],itens:[],sel:null};
async function loadClube(){ catAtiva="fresco:clube"; marcarNav(); $("#q").value=""; $("#btnCesta").setAttribute("aria-pressed","false");
  saida.innerHTML=`<p class="state">Carregando ofertas de clube…</p>`; ctx.textContent="";
  try{ const d=await fetch(`${API}/clube`).then(r=>r.json());
    const mkts=d.mercados||[];
    CLUBE_STATE={mercados:mkts, itens:d.itens||[], sel:mkts[0]?mkts[0].mercado_slug:null};
    renderClube();
  }catch(e){ saida.innerHTML=`<p class="state">Erro ao carregar o clube.</p>`; } }
function setClubeMercado(slug){ CLUBE_STATE.sel=slug; renderClube(); }
function renderClube(){
  const {mercados,itens,sel}=CLUBE_STATE;
  if(!mercados.length){ ctx.textContent="";
    saida.innerHTML=`<p class="state"><span class="big">${ic("crown")}</span>Nenhuma oferta de clube coletada ainda.<br>São os preços que exigem cartão/programa do mercado (ex.: Viva, Fidelidade).</p>`; return; }
  const chips=mercados.map(m=>`<button type="button" class="clube-chip ${sel===m.mercado_slug?"on":""}" onclick="setClubeMercado('${m.mercado_slug}')">
      ${badgeMini(m)}<span class="cm">${esc(m.mercado)}</span><span class="cp">🪪 ${esc(m.programa)}</span><span class="cn">${m.n}</span></button>`).join("");
  const cur=mercados.find(m=>m.mercado_slug===sel);
  const its=itens.filter(o=>o.mercado_slug===sel);
  ctx.textContent=`${its.length} oferta(s) de clube no ${cur?cur.mercado:""}`;
  saida.innerHTML=`<div class="sec-title">${ic("crown")} Ofertas de clube <span class="muted">preços que exigem o programa do mercado</span></div>
    <p class="per-nota">Toque no mercado cujo <b>cartão/clube você tem</b> — mostramos os itens em promoção só pra membros. Quem não tem o cartão paga o preço normal.</p>
    <div class="clube-mkts">${chips}</div>
    ${cur?`<div class="clube-prog">Ofertas <b>${esc(cur.programa)}</b> do <b>${esc(cur.mercado)}</b></div>`:""}
    <div class="per-list">${its.map(cardOferta).join("")}</div>`;
}

let BASICA_ITENS=[];

async function addCestaBasica(btn){

  btn.disabled=true; btn.textContent="Adicionando…";

  atualizarBadge(); btn.textContent="✓ Cesta básica na sua feira";
}
let FRESCOS_STATE={its:[],nome:"",slug:"",ord:"rel"};
const FRESCOS_ORD=[["rel","Mais relevante"],["asc","Menor preço"],["desc","Maior preço"]];
function ordenarFrescos(its,ord){
  const a=its.slice();
  if(ord==="asc") a.sort((x,y)=>x.menor_preco-y.menor_preco);
  else if(ord==="desc") a.sort((x,y)=>y.menor_preco-x.menor_preco);
  else a.sort((x,y)=>(y.n_mercados-x.n_mercados)||(x.nome||"").localeCompare(y.nome||"")); // relevância = mais lojas comparadas
  return a;
}
function setOrdFrescos(o){ FRESCOS_STATE.ord=o; renderFrescosCards(); }
function renderFrescosCards(){
  const {slug,nome,ord,modo}=FRESCOS_STATE;
  const its=ordenarFrescos(FRESCOS_STATE.its,ord);
  const bar=`<div class="sortbar"><span class="sortlbl">Ordenar por</span>${FRESCOS_ORD.map(([k,l])=>`<button type="button" class="sortbtn ${ord===k?"on":""}" onclick="setOrdFrescos('${k}')">${l}</button>`).join("")}</div>`;
  const dica=modo==="bandeja"
    ? `Bandejas e pacotes de carne com gramatura fixa — mostramos o <b>preço da bandeja</b> e, ao lado, quanto sai o kg pra comparar. Carne vendida a peso fica na aba <b>Carnes (por kg)</b>.`
    : `Carne vendida <b>a peso</b> — comparamos pelo <b>preço por kg</b>, que é o que importa. Bandejas e pacotes por grama ficam na aba <b>Bandeja e variados</b>.`;
  saida.innerHTML=`<div class="sec-title">${ic(FRESCO_ICON[slug]||"cat_outros")} ${esc(nome)} <span class="muted">${modo==="bandeja"?"preço da bandeja":"comparado por preço/kg"}</span></div>
    <p class="per-nota">${dica}</p>
    ${bar}
    <div class="grid">${its.map(g=>cardPerecivel(g,ord,modo)).join("")}</div>`;
}
async function loadFrescos(slug,nome){ catAtiva=`fresco:${slug}`; marcarNav(); $("#q").value=""; $("#btnCesta").setAttribute("aria-pressed","false");
  saida.innerHTML=`<p class="state">Carregando ${esc(nome)}…</p>`; ctx.textContent="";
  try{ const d=await fetch(`${API}/frescos/${slug}`).then(r=>r.json());
    const its=d.itens||[];
    ctx.textContent=`${its.length} item(ns) em ${nome}`;
    if(!its.length){ saida.innerHTML=`<p class="state"><span class="big">${ic(FRESCO_ICON[slug]||"cat_outros")}</span>Ainda não coletamos frescos dessa seção. O app puxa mais a cada dia.</p>`; return; }
    FRESCOS_STATE={its,nome,slug,ord:"rel",modo:(d.categoria&&d.categoria.modo)||"kg"};
    renderFrescosCards();
  }catch(e){ saida.innerHTML=`<p class="state">Erro ao carregar.</p>`; } }

/* ---------- cesta / feira do usuário (persistida no Supabase, com RLS por dono) ---------- */
let CESTA_EANS=new Set();
async function tokenAtual(){ if(!sb||!SESSAO) return null; try{ const {data}=await sb.auth.getSession(); return data.session?data.session.access_token:null; }catch(e){ return null; } }
// fetch com o token do usuário no header (o /cesta lê a feira dele + aplica a trava no servidor)
async function fetchAuth(url,opts){ opts=opts||{}; const t=await tokenAtual(); opts.headers=Object.assign({},opts.headers||{},t?{Authorization:"Bearer "+t}:{}); return fetch(url,opts); }
// upsert/delete de um item da feira, direto no Supabase (RLS garante que é só a do dono)
async function listaSet(ean,campos){
  if(!sb||!SESSAO) return false;
  const {error}=await sb.from("lista").upsert(Object.assign({user_id:SESSAO.user.id,ean},campos),{onConflict:"user_id,ean"});
  if(error) console.warn("lista upsert:",error.message);
  return !error;
}
async function listaDel(ean){ if(sb&&SESSAO) await sb.from("lista").delete().eq("user_id",SESSAO.user.id).eq("ean",ean); }

async function addCesta(ean,btn){
  if(!estaLogado()){ abrirLogin(()=>addCesta(ean,btn)); return; }   // feira exige conta (força cadastro)
  const ok=await listaSet(ean,{quantidade:1,comprado:false});
  if(ok){ CESTA_EANS.add(ean); if(btn){ btn.textContent="✓"; btn.classList.add("in"); } atualizarBadge(); }
  else if(btn){ btn.textContent="!"; }
}
async function setQtd(ean,q){ q=parseInt(q,10); if(!q||q<1) q=1; if(q>999) q=999; await listaSet(ean,{quantidade:q}); loadCesta(); }
async function setAlvo(ean,val){ const v=val===""?null:parseFloat(val); await listaSet(ean,{preco_alvo:(v==null||isNaN(v))?null:v}); loadCesta(); }
async function removerCesta(ean,el){
  await listaDel(ean); CESTA_EANS.delete(ean); atualizarBadge();
  // remove a linha NA HORA (sem re-renderizar tudo) -> não pula pro topo, mantém o scroll
  const li=el?el.closest(".li"):document.querySelector(`.li[data-ean="${(window.CSS&&CSS.escape)?CSS.escape(ean):ean}"]`);
  if(li) li.remove();
  const restantes=document.querySelectorAll(".li").length;
  if(!restantes){ loadCesta(); return; }   // esvaziou -> mostra o estado vazio
  const done=document.querySelectorAll(".li.done").length;
  const pt=document.querySelector(".li-progress .txt"); if(pt) pt.textContent=`${done} de ${restantes} no carrinho`;
  const pb=document.querySelector(".li-progress .bar span"); if(pb) pb.style.width=(restantes?Math.round(done/restantes*100):0)+"%";
}
async function esvaziarLista(){
  if(!SESSAO) return;
  if(!confirm("Esvaziar toda a sua lista? Isso remove todos os itens.")) return;
  try{ await sb.from("lista").delete().eq("user_id",SESSAO.user.id); }catch(e){}
  CESTA_EANS=new Set(); atualizarBadge(); loadCesta();
}
async function addFrescoBtn(btn){
  if(!estaLogado()){ abrirLogin(()=>addFrescoBtn(btn)); return; }
  const chave=btn.dataset.chave, nome=btn.dataset.nome;
  const ok=await listaSet("f:"+chave,{nome,quantidade:1,comprado:false});
  if(ok){ CESTA_EANS.add("f:"+chave); btn.textContent="✓ na lista"; btn.classList.add("in"); atualizarBadge(); }
  else{ btn.textContent="!"; }
}
function toggleAlerta(btn){ const ed=btn.nextElementSibling, open=ed.hasAttribute("hidden");
  ed.toggleAttribute("hidden",!open); btn.setAttribute("aria-expanded",String(open));
  if(open){ const inp=ed.querySelector("input"); if(inp){ inp.focus(); inp.select?.(); } } }
async function toggleComprado(ean,val,el){
  const li=el.closest(".li"); if(li) li.classList.toggle("done",val);
  const done=document.querySelectorAll(".li.done").length, total=document.querySelectorAll(".li").length;
  const pt=document.querySelector(".li-progress .txt"); if(pt) pt.textContent=`${done} de ${total} no carrinho`;
  const pb=document.querySelector(".li-progress .bar span"); if(pb) pb.style.width=(total?Math.round(done/total*100):0)+"%";
  await listaSet(ean,{comprado:!!val});
}

/* explica, item a item, de onde vem cada real economizado */
function ecoDetalhe(d){
  const linhas=[];
  (d.itens||[]).forEach(it=>{
    if(!it.melhor) return;
    const nome=esc((it.nome||"").split(" ").slice(0,5).join(" "));
    const q=(it.quantidade>1)?` <span class="ed-q">×${it.quantidade}</span>`:"";
    if(it.economia_mercados_item>0){
      const precos=(it.precos||[]).map(p=>p.preco); const caro=precos.length?Math.max(...precos):null;
      linhas.push(`<li><div class="ed-nome">${nome}${q}</div><div class="ed-txt">${brl(it.melhor.preco)} no ${esc(it.melhor.mercado)}, até ${brl(caro)} em outra loja</div><b class="num">${brl(it.economia_mercados_item)}</b></li>`);
    }
    if(it.economia_dias_item>0&&it.preco_ref_dias){
      linhas.push(`<li><div class="ed-nome">${nome}${q}</div><div class="ed-txt">caiu de ${brl(it.preco_ref_dias)} para ${brl(it.melhor.preco)}</div><b class="num">${brl(it.economia_dias_item)}</b></li>`);
    }
  });
  if(!linhas.length) return "";
  return `<details class="eco-det"><summary>Como calculamos</summary>
    <p class="eco-fonte">Usamos os preços online que o app coleta em cada mercado todo dia. O cálculo é feito item por item — a diferença entre a loja mais barata e a mais cara, mais quedas de preço recentes:</p>
    <ul class="eco-lista">${linhas.join("")}</ul></details>`;
}
/* ranking de mercados (comprando tudo numa loja só) */
function rankingMercados(d){
  // COMPARAÇÃO JUSTA: só lojas onde dá pra fazer a feira (falta pouco), pelo total da FEIRA
  // INTEIRA (o que a loja tem + o que falta pelo menor preço fora). Já vem ordenado do servidor.
  const mkts=(d.mercados||[]).filter(m=>m.viavel);
  if(!mkts.length) return "";
  const min=mkts[0].completo_total;
  const medal=["🥇","🥈","🥉"];
  const linhas=mkts.slice(0,6).map((m,i)=>{
    const diff=m.completo_total-min;
    const extra=i===0
      ? `<div class="d ok">mais barata pra sua feira</div>`
      : `<div class="d num">R$ ${diff.toFixed(2).replace(".",",")} a mais</div>`;
    const sub=m.completo
      ? `tem todos os ${d.n_itens} itens`
      : `tem ${m.cobertura}, + ${m.faltam} ${m.faltam===1?"item estimado":"itens estimados"} pela média`;
    return `<div class="mrank-row">
      <span class="mrank-medal">${medal[i]||"·"}</span>
      <div class="mrank-info"><div class="mrank-nm">${badgeMini(m)} ${esc(m.nome)}${seloFav(m)} <span class="mrank-cover ${m.completo?"full":""}">${m.cobertura}/${d.n_itens}</span></div>
        <div class="mrank-sub">${sub}</div></div>
      <div class="mrank-val"><div class="t num">${brl(m.completo_total)}</div>${extra}</div>
    </div>`;
  }).join("");
  const nota=`<p class="mrank-nota">Quanto sua <b>feira inteira</b> (${d.n_itens} itens) sai em cada loja: o que ela tem + os que faltam <b>estimados pelo preço médio</b> (a loja não vende o item). Assim a comparação é justa. O valor em <b class="tred">vermelho</b> é quanto sai <b>mais caro</b> que a mais barata.</p>`;
  return `<div class="sec-title">Sua feira inteira, comparada de forma justa</div>${nota}<div class="mrank">${linhas}</div>`;
}
function cardItemCesta(it){
  const uni=it.rotulo?" "+it.rotulo.replace(/R\$/,"").trim():"";
  const m=it.melhor, preco=m?brl(m.preco)+uni:"—";
  // grátis vê o menor PREÇO, mas não em QUAL mercado (o "onde" é o que vale)
  const merc=m?(acessoPremium()
    ? `${esc(m.mercado)} ${m.url?verLink(m.url,m.mercado):""}`
    : `<span class="mkt-oculto">${ic("lock")} ver o mercado</span>`):"sem preço";
  const queda=(it.economia_dias_item>0&&it.preco_ref_dias)?`<span class="queda">↓ caiu de ${brl(it.preco_ref_dias)}</span>`:"";
  const alertaOn=it.disparado;
  const tagFresco=it.tipo==="fresco"?`<span class="li-tag">fresco · por peso</span>`:"";
  return `<div class="li ${it.comprado?"done":""}" data-ean="${esc(it.ean)}">
    <input class="chk" type="checkbox" ${it.comprado?"checked":""} aria-label="Marcar ${esc(it.nome)} como já comprado" onchange="toggleComprado('${it.ean}',this.checked,this)">
    ${thumb(it.imagem_url,it.nome)}
    <div class="li-body">
      <div class="li-nome">${esc(it.nome)} ${tagFresco}</div>
      <div class="li-menor num">menor preço <b>${preco}</b> · ${merc} ${queda}</div>
      <div class="li-alert-wrap">
        <button class="li-alert-btn ${alertaOn?"on":""}" type="button" aria-expanded="false" onclick="toggleAlerta(this)">${ic("bell")} ${it.preco_alvo!=null?`${alertaOn?"no alvo! ":""}alertar abaixo de <b class="num">${brl(it.preco_alvo)}</b>`:"criar alerta de preço"}</button>
        <div class="li-alert-edit" hidden>
          <span>avisar quando ficar abaixo de:</span>
          <input class="alvo-in num" type="number" step="0.01" min="0" value="${it.preco_alvo??""}" aria-label="Preço-alvo de ${esc(it.nome)}">
          <button class="btn-sm" type="button" onclick="setAlvo('${it.ean}',this.previousElementSibling.value)">Salvar</button>
        </div>
      </div>
    </div>
    <div class="li-act">
      <div class="stepper" role="group" aria-label="Quantidade de ${esc(it.nome)}">
        <button type="button" aria-label="Diminuir 1" onclick="setQtd('${it.ean}',${it.quantidade-1})">${ic("minus")}</button>
        <input class="qin num" type="number" inputmode="numeric" min="1" max="999" step="1" value="${it.quantidade}"
          aria-label="Quantidade de ${esc(it.nome)}" onchange="setQtd('${it.ean}',this.value)" onkeydown="if(event.key==='Enter'){setQtd('${it.ean}',this.value)}">
        <button type="button" aria-label="Aumentar 1" onclick="setQtd('${it.ean}',${it.quantidade+1})">${ic("plus")}</button>
      </div>
      <button class="li-rm" type="button" aria-label="Remover ${esc(it.nome)} da lista" onclick="removerCesta('${it.ean}',this)">${ic("trash")}</button>
    </div>
  </div>`;
}
/* modo da lista: "meus" (só os mercados favoritos) x "todos". Só faz sentido com favoritos. */
const LISTA_MODO_KEY="mb_lista_modo";
function listaModo(){ return favMercados().length?lsGet(LISTA_MODO_KEY,"meus"):"todos"; }
function setListaModo(m){ lsSet(LISTA_MODO_KEY,m); loadCesta(); }
async function loadCesta(){
  catAtiva=null; marcarNav(); $("#q").value=""; $("#btnCesta").setAttribute("aria-pressed","true");
  saida.innerHTML=`<p class="state">Montando sua lista…</p>`; ctx.textContent="";
  try{
    const favs=favMercados(), modo=listaModo();
    const qs=(modo==="meus"&&favs.length)?`?mercados=${encodeURIComponent(favs.join(","))}`:"";
    const d=await fetchAuth(`${API}/cesta${qs}`).then(r=>r.json());
    CESTA_EANS=new Set((d.itens||[]).map(i=>i.ean));
    if(!d.n_itens){ ctx.textContent="";
      saida.innerHTML=estaLogado()
        ? `<p class="state"><span class="big">${ic("cart")}</span>Sua feira está vazia.<br>Busque produtos e toque em <b>+</b> para montar sua lista.</p>`
        : `<p class="state"><span class="big">${ic("user")}</span>Entre pra montar sua feira e ver quanto dá pra economizar.<br><button class="btn-primary" style="margin-top:14px;width:auto;padding:0 20px" onclick="abrirLogin(()=>loadCesta())">Entrar / criar conta</button></p>`;
      return; }
    ctx.textContent="";
    const banner=d.n_alertas>0?`<div class="alerta-banner">${ic("bell")} ${d.n_alertas} item(ns) no preço-alvo ou abaixo</div>`:"";
    const eMerc=d.economia_mercados||0, eDias=d.economia_dias||0, heroVal=eMerc>0?eMerc:eDias;
    // % de economia = quanto o "comprar esperto" poupa vs. pagar o MAIS CARO de cada item (real).
    const naiveTot=((d.mix&&d.mix.total)||0)+eMerc;
    const pctEco=(eMerc>0&&naiveTot>0)?Math.round(100*eMerc/naiveTot):0;
    const prem=(d.premium!==undefined)?d.premium:acessoPremium();  // verdade do servidor
    const trialBanner=trialAtivo()?`<div class="trial-banner">${ic("crown")} Acesso completo liberado — faltam <b>${diasRestantesTrial()} dia(s)</b> do seu período grátis</div>`:"";
    const ecoBox=(eMerc>0||eDias>0)?`<div class="eco">
        <div class="eco-lbl">Você pode economizar</div>
        <div class="eco-num num">${brl(heroVal)}${pctEco>0?`<span class="eco-pct">até ${pctEco}%</span>`:""}</div>
        <div class="eco-sub">Comprando cada produto pelo menor preço em vez do mais caro${(eMerc>0&&eDias>0)?`, e aproveitando ${brl(eDias)} em quedas recentes`:""}.</div>
        ${prem?ecoDetalhe(d):`<div class="pw-inline">${ic("lock")} No PouPou+ você vê item a item de onde vem essa economia</div>`}
      </div>`:"";
    // 1 loja vs otimizada — os TOTAIS agregados ficam LIVRES (grátis entende o valor)
    const mm=d.melhor_mercado, poupa=d.economia_dividido_vs_loja;
    let vs="";
    if(mm){
      const mmNome=prem?`${badgeMini(mm)} ${esc(mm.nome)}`:`<span class="mkt-oculto">${ic("lock")} a loja mais barata</span>`;
      const umaLoja=`<div class="vs-card"><div class="vs-tag">${mm.completo?"Compra em 1 mercado":"Feira quase toda numa loja"}</div><div class="vs-mkt">${mmNome}</div><div class="vs-val num">${brl(mm.completo_total!=null?mm.completo_total:mm.total)}</div><div class="vs-sub">${mm.completo?`os ${d.n_itens} itens numa loja só`:`tem ${mm.cobertura}/${d.n_itens} · +${mm.faltam} estimado pela média`}</div></div>`;
      const otim=`<div class="vs-card best"><div class="vs-tag">Compra otimizada</div><div class="vs-mkt">${d.mix.n_mercados} mercados</div><div class="vs-val num">${brl(d.mix.total)}</div><div class="vs-sub">${(poupa!=null&&poupa>0)?`economia de <b style="color:var(--green-dark)">${brl(poupa)}</b>`:"pegando cada item no menor preço"}</div></div>`;
      vs=`<div class="vs">${umaLoja}<div class="vs-mid">vs</div>${otim}</div>`;
    }
    // compra otimizada — grupos por mercado (o "ONDE pegar cada item" = payload trancado)
    const grupos=(d.mix.divisao||[]).map(g=>`<div class="grp">
        <div class="grp-h">${badgeMini(g)}<span class="nm">${esc(g.nome)}</span><span class="n">${g.itens.length} ${g.itens.length===1?"produto":"produtos"}</span><span class="sub num">${brl(g.subtotal)}</span></div>
        ${g.itens.map(i=>`<div class="grp-i"><span>${i.quantidade}× ${esc(i.nome)}</span><span class="p num">${brl(i.subtotal)} ${verLink(i.url,g.nome)}</span></div>`).join("")}
      </div>`).join("");
    const otimBloco=grupos?`<div class="sec-title">Sua compra otimizada <span class="muted">o que pegar em cada mercado</span></div>${grupos}`:"";
    // PAYWALL "valor primeiro": grátis vê o NÚMERO da economia + os totais 1-loja vs otimizada
    // + o mercado único mais barato. Tranca a EXECUÇÃO: o detalhamento "onde pegar cada item"
    // e o ranking completo. Trial/assinante veem tudo.
    let miolo;
    if(prem){
      miolo=vs+otimBloco+rankingMercados(d);
    }else{
      const teaser=(poupa!=null&&poupa>0)?`economizar até ${brl(poupa)} nesta feira`:`ver onde comprar cada item mais barato`;
      miolo=vs+bloqueado(otimBloco+rankingMercados(d), `Desbloqueie pra ${teaser}`,
        `Você já vê <b>quanto</b> dá pra economizar e a loja única mais barata. O PouPou+ mostra <b>em qual mercado</b> pegar cada item e <b>qual</b> sai mais barato no total.`);
    }
    // toggle "Meus mercados / Todos" (só aparece se a pessoa tem favoritos)
    const semMeus=(modo==="meus"&&favs.length&&!(d.mercados||[]).some(m=>m.viavel));
    const modoToggle=favs.length?`<div class="lista-modo"><div class="lm-seg">
        <button type="button" class="${modo==='meus'?'on':''}" onclick="setListaModo('meus')">${ic('star')} Meus mercados</button>
        <button type="button" class="${modo==='todos'?'on':''}" onclick="setListaModo('todos')">Todos os mercados</button>
      </div>${modo==='meus'?`<div class="lm-hint">Comparando só os ${favs.length} mercado${favs.length>1?"s":""} que você marcou como seus.</div>`:""}</div>`:"";
    if(semMeus){ miolo=`<div class="lm-empty">Nenhum dos seus mercados cobre esta feira o suficiente pra comparar. Toque em <b>Todos os mercados</b> acima pra ver todas as lojas.</div>`; }
    const pctC=d.n_itens?Math.round((d.n_comprados||0)/d.n_itens*100):0;
    const prog=`<div class="li-progress"><span class="txt">${d.n_comprados||0} de ${d.n_itens} no carrinho</span><div class="bar"><span style="width:${pctC}%"></span></div></div>`;
    const listaTitle=`<div class="sec-title lista-hd"><span>Minha lista <span class="muted">${d.n_itens} ${d.n_itens===1?"produto":"produtos"} · marque o que já pegou</span></span><button class="li-esvaziar" type="button" onclick="esvaziarLista()">${ic("trash")} Esvaziar</button></div>`;
    saida.innerHTML=trialBanner+banner+modoToggle+ecoBox+miolo+listaTitle+prog+d.itens.map(cardItemCesta).join("");
  }catch(e){ saida.innerHTML=`<p class="state">Erro ao carregar a lista.</p>`; }
}

    $("#cfN").textContent=d.n_itens; $("#cestaFixa").hidden=(d.n_itens||0)===0;

/* ============ conta / assinatura / paywall — "valor primeiro, login no clímax" ============
   Grátis SENTE o valor (o número da economia + o mercado único mais barato), mas o "ONDE
   comprar cada item" (mapa item×mercado, rota otimizada, ranking completo) fica TRANCADO.
   Clique em desbloquear -> login no clímax + reverse trial de 3 dias (tudo liberado). Fim do
   trial -> cai pro grátis borrado. Tudo simulado no localStorage; a trava REAL (server-side) e
   o Mercado Pago entram na Fase 2. */
