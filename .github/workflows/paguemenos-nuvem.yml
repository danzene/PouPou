name: Coleta Pague Menos (nuvem)

# O Super Pague Menos migrou pra VTEX (~20/10/2026) e a API publica de catalogo responde
# normal aos servidores do GitHub (EUA) - entao agora coleta direto daqui, igual aos outros
# VTEX. O caminho antigo (Vercel raspando o HTML do site Convertiez) quebrou na migracao:
# ficou ~2 dias em 0% com o robo dizendo "sucesso". Hoje coletar.py SAI COM ERRO se o
# mercado vier vazio, e o checar_saude.py (saude-coleta.yml) vigia todo dia.

on:
  # horario: quem dispara e o pg_cron do Supabase (supabase/agendador.sql) -
  # o 'schedule' do GitHub atrasava horas ou pulava execucoes.
  workflow_dispatch: {}    # botao "Run workflow" pra rodar na hora

concurrency:
  group: paguemenos-nuvem
  cancel-in-progress: false

jobs:
  coleta:
    uses: ./.github/workflows/_coleta.yml
    secrets: inherit
    with:
      timeout: 240
      comandos: python coletar.py superpaguemenos
