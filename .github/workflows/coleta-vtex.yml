name: Coleta VTEX completa (nuvem)

# Crawl COMPLETO dos VTEX (Savegnago, Covabra, Atacadao, Oba) - descobre produtos novos.
# E o crawl pesado, 1x/dia. Depois: poda do historico + conferidor (auto-cura).
# Era a tarefa MercadoBarato-Rapidos do PC.

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 08:00 Brasilia
  workflow_dispatch: {}

concurrency:
  group: coleta-vtex       # mesmo grupo do refresh: nunca bate nos mesmos sites em paralelo
  cancel-in-progress: false

jobs:
  coleta:
    uses: ./.github/workflows/_coleta.yml
    secrets: inherit
    with:
      timeout: 330
      comandos: |
        python coletar.py savegnago covabra atacadao oba
        python manutencao.py || echo "::warning::manutencao falhou (segue)"
        python conferir_precos.py --corrigir || echo "::warning::conferidor achou divergencias (ver log)"

  # Repositorio PUBLICO: o GitHub desliga workflows agendados apos 60 dias sem commit.
  # Este job religa todos 1x/dia, pra coleta nunca parar sozinha de novo.
  manter-ligado:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Religar workflows agendados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/workflows" --jq '.workflows[].id'); do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/enable" || true
          done
