name: Coleta VIP + Tenda (nuvem)

# VIP Commerce (Enxuto, Dalben, Taquaral, Spani) + Tenda. Nao tem refresh leve, entao a
# unica forma de manter fresco e re-coletar: 3x/dia. Era a MercadoBarato-VipTenda.

on:
  # horario: quem dispara e o pg_cron do Supabase (supabase/agendador.sql) -
  # o 'schedule' do GitHub atrasava horas ou pulava execucoes.
  workflow_dispatch: {}

concurrency:
  group: coleta-vip-tenda
  cancel-in-progress: false

jobs:
  coleta:
    uses: ./.github/workflows/_coleta.yml
    secrets: inherit
    with:
      timeout: 180
      comandos: python coletar.py enxuto dalben taquaral tenda spani
